   색: QwipBook 무채색 v2 기준(iOS 시스템 회색). 유채색은 상태 점, 축하 색종이, 농장 그림에만. */
:root {
  --page: #F2F2F7;
  --bg: #FFFFFF;
  --card: #F2F2F7;
  --paper: #F5F5F7;
  --fg: #111111;
  --fg2: #6E6E73;
  --fg3: #8E8E93;
  --chip-line: #D1D1D6;
  --line: #E5E5EA;
  --on-fg: #FFFFFF;
  --float: #FFFFFF;
  --bubble: #FFFFFF;
  --bubble-line: #E5E5EA;
  --press: rgb(0 0 0 / .06); --press-strong: rgb(0 0 0 / .1);
  --good: #34C759;
  --warn: #FF8D28;
  --bad: #FF383C;
  --blue: #0088FF;
  --yellow: #FFCC00;
  --pink: #FF2D55;
  --purple: #AF52DE;
  /* 게임 요소(온보딩): iOS 시스템 초록과 갈색. 버튼 바탕은 흰 글자를 읽을 수 있게 시스템 초록의 고대비 값 */
  --go: #248A3D; --go-lip: #1A6B2F; --on-go: #FFFFFF;
  --sel: #34C759; --sel-bg: rgb(52 199 89 / .12); --sel-lip: #2AA14A;
  --lip: #D1D1D6;
  --soil: rgb(162 132 94 / .26); --soil-lip: rgb(162 132 94 / .55); --seed: #A2845E; --trunk: #A2845E;
  --leaf: #34C759; --leaf-d: #248A3D;
  --coin: #FFCC00; --coin-edge: #E0A200;
  --shadow: 0 2px 6px rgb(0 0 0 / .04), 0 8px 44px rgb(0 0 0 / .14);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .04), 0 4px 14px rgb(0 0 0 / .06);
  --pal-shadow: drop-shadow(0 10px 10px rgb(0 0 0 / .10));
  --scrim: rgb(0 0 0 / .45);
  --font-ui: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-num: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
  --r-chip: 12px;
  --r-card: 18px;
  --r-stage: 24px;
  --r-sheet: 28px;
  --t1: 30px; --l1: 40px;
  --t2: 26px; --l2: 35px;
  --t3: 22px; --l3: 31px;
  --t4: 20px; --l4: 29px;
  --t5: 17px; --l5: 25.5px;
  --t6: 15px; --l6: 22.5px;
  --t7: 13px; --l7: 19.5px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0A0A0B; --bg: #000000; --card: #1C1C1E; --paper: #1C1C1E;
    --fg: #F5F5F7; --fg2: #98989D; --fg3: #6E6E73; --chip-line: #3A3A3C; --line: #2C2C2E; --on-fg: #000000; --float: #1C1C1E;
    --bubble: #2C2C2E; --bubble-line: #3A3A3C; --press: rgb(255 255 255 / .08); --press-strong: rgb(255 255 255 / .14);
    --good: #30D158; --warn: #FF9230; --bad: #FF4245; --blue: #0091FF; --yellow: #FFD600; --pink: #FF375F; --purple: #BF5AF2;
    --go: #30D158; --go-lip: #1F8F3E; --on-go: #000000; --sel: #30D158; --sel-bg: rgb(48 209 88 / .16); --sel-lip: #1F8F3E; --lip: #3A3A3C;
    --soil: rgb(172 142 104 / .30); --soil-lip: rgb(172 142 104 / .6); --seed: #AC8E68; --trunk: #AC8E68; --leaf: #30D158; --leaf-d: #1F8F3E; --coin: #FFD600; --coin-edge: #C99A00;
    --shadow: 0 2px 6px rgb(0 0 0 / .4), 0 8px 44px rgb(0 0 0 / .6); --shadow-sm: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .3); --pal-shadow: drop-shadow(0 10px 12px rgb(0 0 0 / .5)); --scrim: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0A0A0B; --bg: #000000; --card: #1C1C1E; --paper: #1C1C1E;
  --fg: #F5F5F7; --fg2: #98989D; --fg3: #6E6E73; --chip-line: #3A3A3C; --line: #2C2C2E; --on-fg: #000000; --float: #1C1C1E;
  --bubble: #2C2C2E; --bubble-line: #3A3A3C; --press: rgb(255 255 255 / .08); --press-strong: rgb(255 255 255 / .14);
  --good: #30D158; --warn: #FF9230; --bad: #FF4245; --blue: #0091FF; --yellow: #FFD600; --pink: #FF375F; --purple: #BF5AF2;
    --go: #30D158; --go-lip: #1F8F3E; --on-go: #000000; --sel: #30D158; --sel-bg: rgb(48 209 88 / .16); --sel-lip: #1F8F3E; --lip: #3A3A3C;
    --soil: rgb(172 142 104 / .30); --soil-lip: rgb(172 142 104 / .6); --seed: #AC8E68; --trunk: #AC8E68; --leaf: #30D158; --leaf-d: #1F8F3E; --coin: #FFD600; --coin-edge: #C99A00;
  --shadow: 0 2px 6px rgb(0 0 0 / .4), 0 8px 44px rgb(0 0 0 / .6); --shadow-sm: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .3); --pal-shadow: drop-shadow(0 10px 12px rgb(0 0 0 / .5)); --scrim: rgb(0 0 0 / .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: var(--t5); line-height: var(--l5);
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* 누르는 느낌: 버튼과 줄은 눌린 동안 살짝 작아짐 */
.btn, .chip, .mini, .tab, .check, .task-open, .edit, .back, .review button, .answered, .party-close {
  transition: transform .16s var(--ease), background-color .2s, border-color .2s, color .2s, box-shadow .2s;
}
.btn:active:not(:disabled), .chip:active, .mini:active, .edit:active, .check:active, .answered:active, .party-close:active { transform: scale(.96); }
.tab:active, .task-open:active { transform: scale(.98); }
.task-open:active { background: var(--press); }

.layout { display: flex; justify-content: center; align-items: flex-start; gap: 32px; }
.review { display: none; }
.app { width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; position: relative; }
#app { flex: 1; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; }
@media (min-width: 560px) {
  body { background: var(--page); }
  .layout { padding-block: 32px; }
  .app { min-height: 840px; border-radius: 36px; overflow: clip; box-shadow: var(--shadow); }
}
@media (min-width: 900px) {
  .review { display: flex; flex-direction: column; gap: 2px; width: 196px; position: sticky; top: 32px; }
}
#review-list { display: flex; flex-direction: column; gap: 2px; }
.review h2 { font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); margin: 0 0 8px 12px; }
.review button { text-align: left; border: 0; background: transparent; padding: 8px 12px; border-radius: var(--r-chip); font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.review button[aria-current="true"] { background: var(--bg); color: var(--fg); font-weight: 600; }
.review p { font-size: var(--t7); line-height: var(--l7); color: var(--fg3); margin: 12px 12px 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.bar-in { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-size: var(--t5); line-height: var(--l5); font-weight: 700; margin: 0; flex: 1; }
.back { border: 0; background: transparent; width: 40px; height: 40px; margin-left: -10px; border-radius: 50%; display: grid; place-items: center; }
.back svg { width: 24px; height: 24px; }
.demo { font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); background: var(--card); padding: 4px 10px 4px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.demo::before, .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dot, var(--fg3)); }
.demo { --dot: var(--warn); }

.content { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 28px; }
.foot { position: sticky; bottom: 0; z-index: 4; background: linear-gradient(to bottom, transparent, var(--bg) 22%); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.foot-hint { margin: 0; text-align: center; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }

.btn { border: 0; border-radius: 999px; min-height: 56px; padding: 0 22px; font-size: var(--t5); line-height: var(--l5); font-weight: 600; width: 100%; }
.btn-primary { background: var(--fg); color: var(--on-fg); }
.btn-primary:disabled { background: var(--card); color: var(--fg3); cursor: not-allowed; }
.btn-soft { background: var(--card); color: var(--fg); }
.btn-text { background: transparent; color: var(--fg2); min-height: 48px; font-size: var(--t6); line-height: var(--l6); font-weight: 500; }
.fine { font-size: var(--t7); line-height: var(--l7); color: var(--fg2); margin: 0; }
.sub { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); margin: 0; }

/* 파밍이 무대: 말풍선이 위, 큰 파밍이가 아래 가운데 */
.duo { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
.bubble { position: relative; z-index: 1; width: 100%; max-width: 350px; background: var(--bubble); border: 1px solid var(--bubble-line); border-radius: 22px; padding: 16px 18px; text-align: center; box-shadow: var(--shadow-sm); transform-origin: 50% 100%; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; margin-left: -7px; background: var(--bubble); border-right: 1px solid var(--bubble-line); border-bottom: 1px solid var(--bubble-line); transform: rotate(45deg); border-bottom-right-radius: 3px; }
.bubble h2 { margin: 0; font-size: var(--t3); line-height: var(--l3); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.bubble h2 em { font-style: normal; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bubble p { margin: 6px 0 0; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); text-wrap: pretty; }
.bubble p.react { color: var(--fg); font-weight: 600; }
.pal-wrap { animation: bob 2.8s ease-in-out infinite; }
.pal-btn { border: 0; background: none; padding: 0; display: block; border-radius: 50%; }
.hero-pal { width: 116px; height: auto; display: block; transform-origin: 0 0; filter: var(--pal-shadow); }
.duo.lg .hero-pal { width: 132px; }
@keyframes bob { 50% { transform: translateY(-5px); } }

/* 시작: 예전 프로토타입의 농장 섬 그림과 이름만 */
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(24px + env(safe-area-inset-top, 0px)) 8px; }
.splash-art { width: min(100%, 340px); animation: bob 3.6s ease-in-out infinite; }
.splash-art img { width: 100%; height: auto; display: block; filter: var(--pal-shadow); }
.splash h1 { margin: 0; font-size: var(--t1); line-height: var(--l1); font-weight: 800; letter-spacing: -0.02em; }
.splash p { margin: 8px 0 0; font-size: var(--t5); line-height: var(--l5); color: var(--fg2); text-wrap: balance; }
.hello { justify-content: center; }
.hello-tip { margin: 0; text-align: center; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); text-wrap: balance; }

/* 게임 버튼과 선택지: 아래 턱이 있는 입체 모양. 누르면 턱만큼 내려감(듀오링고 방식) */
.gbtn { border: 0; border-radius: 16px; min-height: 56px; width: 100%; padding: 0 22px; background: var(--go); color: var(--on-go); font-size: var(--t5); line-height: var(--l5); font-weight: 700; box-shadow: 0 4px 0 var(--go-lip); transition: transform .1s, box-shadow .1s, background-color .2s, color .2s; }
.gbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--go-lip); }
.gbtn:disabled { background: var(--card); color: var(--fg3); box-shadow: 0 4px 0 var(--line); cursor: not-allowed; }
.gopts { display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.gopt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 8px 14px 8px 10px; min-height: 60px; font-size: var(--t5); line-height: var(--l5); font-weight: 500; box-shadow: 0 4px 0 var(--lip); transition: transform .1s, box-shadow .1s, background-color .2s, border-color .2s; }
.gopt:active { transform: translateY(4px); box-shadow: 0 0 0 var(--lip); }
.gopt[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-bg); box-shadow: 0 4px 0 var(--sel-lip); font-weight: 700; }
.gopt[aria-pressed="true"]:active { box-shadow: 0 0 0 var(--sel-lip); }
.gopt.plain { padding-left: 16px; }
.gopt .gt { flex: 1; min-width: 0; }
.gico { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--card); display: grid; place-items: center; transition: background-color .2s; }
.gico svg { width: 32px; height: 32px; display: block; }
.gopt[aria-pressed="true"] .gico { background: var(--bg); }
.gtick { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
.gopt.multi .gtick { border-radius: 8px; }
.gtick svg { width: 14px; height: 14px; color: var(--on-go); opacity: 0; transition: opacity .15s; }
.gopt[aria-pressed="true"] .gtick { background: var(--sel); border-color: var(--sel); }
.gopt[aria-pressed="true"] .gtick svg { opacity: 1; }

/* 질문 진행: 밭 다섯 칸. 답할 때마다 한 칸에 새싹이 자람. 두 갈래 질문은 첫 답에 씨앗, 둘째 답에 새싹 */
.plots { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; height: 40px; }
.plot { position: relative; }
.plot .soil { position: absolute; left: 0; right: 0; bottom: 4px; height: 12px; border-radius: 6px; background: var(--soil); box-shadow: 0 3px 0 var(--soil-lip); }
.plot.cur .soil { outline: 2px solid var(--soil-lip); outline-offset: 2px; }
.plot svg { position: absolute; left: 50%; bottom: 10px; width: 28px; height: 28px; margin-left: -14px; transform-origin: 50% 100%; }

/* 태어난 해 바퀴: 굴려서 고르고, 눌러서도 고름 */
.wheel-box { position: relative; }
.wheel-band { position: absolute; left: 0; right: 0; top: 88px; height: 48px; margin-top: -2px; border-radius: 14px; background: var(--card); pointer-events: none; }
.wheel { position: relative; height: 220px; overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); border-radius: 14px; }
.wheel::-webkit-scrollbar { display: none; }
.wheel-list { padding-block: 88px; }
.wheel-item { height: 44px; display: flex; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: center; font-size: var(--t5); color: var(--fg3); cursor: pointer; transition: color .15s, transform .15s; user-select: none; }
.wheel-item .num { font-size: var(--t4); font-weight: 600; }
.wheel-item.on { color: var(--fg); font-weight: 700; transform: scale(1.18); }
.wheel-item.on .num { font-weight: 800; }

/* 계산하는 동안: 할 일이 하나씩 체크됨 */
.calc-list { list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--card); border-radius: var(--r-card); }
.calc-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: center; font-size: var(--t5); line-height: var(--l5); color: var(--fg2); transition: color .2s; }
.calc-list li.ok { color: var(--fg); font-weight: 600; }
.calc-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); transition: background-color .2s; }
.calc-list li.ok .calc-dot { background: var(--sel); }
.calc-dot svg { width: 14px; height: 14px; color: var(--on-go); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--fg2); animation: spin .8s linear infinite; }

.answered { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: var(--card); border-radius: var(--r-chip); padding: 12px 16px; text-align: left; font-size: var(--t6); line-height: var(--l6); }
.answered .k { color: var(--fg2); flex: none; }
.answered .v { flex: 1; min-width: 0; font-weight: 600; }
.answered .chg { flex: none; color: var(--fg2); text-decoration: underline; text-underline-offset: 3px; }
.chips { display: flex; flex-direction: column; gap: 8px; }
.chip { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; border: 1px solid var(--chip-line); background: var(--bg); border-radius: var(--r-chip); padding: 15px 16px; font-size: var(--t5); line-height: var(--l5); min-height: 58px; }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 600; }
.chip .tick { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid var(--chip-line); display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
.chip[aria-pressed="true"] .tick { background: var(--fg); border-color: var(--fg); }
.chip .tick svg { width: 13px; height: 13px; color: var(--on-fg); opacity: 0; transition: opacity .15s; }
.chip[aria-pressed="true"] .tick svg { opacity: 1; }
.chips.row { flex-direction: row; flex-wrap: wrap; }
.chips.row .chip { flex: 1 1 auto; justify-content: center; min-height: 48px; padding: 10px 14px; }
.chips.row .chip .tick { display: none; }

/* 카드와 결과 */
.card { background: var(--card); border-radius: var(--r-card); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-head h3 { margin: 0; font-size: var(--t4); line-height: var(--l4); font-weight: 700; }
.card-head > span:not(.pill) { font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); white-space: nowrap; }
.card > p { margin: 0; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.tbl { display: flex; flex-direction: column; }
.tbl-head { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0 6px; border-top: 1px solid var(--line); font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); }
.tbl-head span:first-child { grid-column: 2; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px 10px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.rank li:first-child { border-top: 0; padding-top: 6px; }
.rank .n { font-family: var(--font-num); font-weight: 700; font-size: var(--t7); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--fg2); }
.rank li.top .n { background: var(--fg); color: var(--on-fg); }
.rank .main { min-width: 0; }
.rank .name { font-weight: 600; font-size: var(--t5); line-height: var(--l5); }
.rank .cond { grid-column: 2 / 4; margin-top: -6px; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.rank .won { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--t5); line-height: var(--l5); white-space: nowrap; }
.rank li.top .won { font-weight: 700; }
.rank .won small { display: block; font-family: var(--font-ui); font-weight: 500; font-size: var(--t7); line-height: var(--l7); color: var(--fg2); }
.rank .extra { grid-column: 2 / 4; display: flex; flex-direction: column; gap: 8px; }
.rank li.now { background: var(--bg); border-radius: var(--r-chip); border-top: 0; padding: 12px; margin-top: 10px; align-items: center; }
.rank li.now .n { width: auto; height: auto; background: none; font-family: var(--font-ui); color: var(--fg2); font-weight: 600; }
.rank li.now .name, .rank li.now .won { color: var(--fg2); font-weight: 500; }
.flag { font-size: var(--t6); line-height: var(--l6); color: var(--fg); display: flex; gap: 8px; align-items: flex-start; }
.flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 8px; background: var(--dot, var(--warn)); }
.flag.good { --dot: var(--good); }
.ask { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--t6); line-height: var(--l6); background: var(--bg); padding: 12px 14px; border-radius: var(--r-chip); }
.ask span { flex: 1 1 100%; }
.ask .mini { flex: 1 1 0; }
.mini { border: 1px solid var(--chip-line); background: var(--bg); color: var(--fg); border-radius: 999px; min-height: 40px; padding: 8px 16px; font-size: var(--t6); line-height: var(--l6); font-weight: 600; }
.basis { font-size: var(--t7); line-height: var(--l7); color: var(--fg2); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair div { background: var(--bg); border-radius: var(--r-chip); padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 1px solid transparent; }
.pair .k { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.pair .v { font-family: var(--font-num); font-weight: 700; font-size: var(--t3); line-height: var(--l3); }
.pair .s { font-size: var(--t7); line-height: var(--l7); color: var(--fg2); }
.pair .win { border-color: var(--fg); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 12px; font-size: var(--t6); line-height: var(--l6); padding: 6px 0; align-items: center; }
.steps li::before { content: counter(s); font-family: var(--font-num); font-size: var(--t7); font-weight: 700; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--t5); line-height: var(--l5); flex-wrap: wrap; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-chip); font-size: var(--t6); line-height: var(--l6); background: var(--bg); }
.note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 8px; background: var(--dot, var(--fg3)); }
.note-warn { --dot: var(--warn); }
.note-info { --dot: var(--fg3); color: var(--fg2); }
.pill { font-size: var(--t7); line-height: var(--l7); font-weight: 600; padding: 4px 10px 4px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: var(--bg); color: var(--fg); }
.pill-good { --dot: var(--good); }
.pill-warn { --dot: var(--warn); }
.pill-mute { --dot: var(--fg3); color: var(--fg2); }
.pill-strong { background: var(--fg); color: var(--on-fg); --dot: var(--good); }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.facts li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); font-size: var(--t6); line-height: var(--l6); }
.facts li:first-child { border-top: 0; padding-top: 0; }
.facts .k { color: var(--fg2); flex: none; }
.facts .v { text-align: right; font-weight: 600; min-width: 0; }
.learn { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.learn li { background: var(--card); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 2px; }
.learn b { font-size: var(--t5); line-height: var(--l5); }
.learn span { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }

/* 파밍이 한마디(소식, 시트): 작은 파밍이와 말풍선 */
.chat { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
.chat .pal { width: 40px; height: auto; display: block; }
.msg { background: var(--card); border-radius: 6px 18px 18px 18px; padding: 10px 14px; font-size: var(--t6); line-height: var(--l6); }
.msg b { display: block; font-size: var(--t7); line-height: var(--l7); color: var(--fg2); font-weight: 600; }

/* 시트: 지금 화면을 보며 끝내는 짧은 입력만 */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 430px; background: var(--bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 92vh; overflow: auto; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--chip-line); align-self: center; flex: none; }
.sheet h3 { margin: 0; font-size: var(--t3); line-height: var(--l3); font-weight: 700; text-wrap: balance; }

/* 홈 */
.farm { display: flex; flex-direction: column; gap: 10px; }
.farm-stage { position: relative; background: var(--paper); border-radius: var(--r-stage); overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; }
/* 말풍선은 2줄 높이로 고정해 말이 바뀌어도 섬이 움직이지 않게 함 */
.stage-say { position: relative; z-index: 3; min-height: calc(var(--l5) * 2 + 26px); display: grid; place-items: center; text-align: center; text-wrap: balance; white-space: pre-line; background: var(--bubble); border: 1px solid var(--bubble-line); border-radius: 20px; padding: 12px 16px; font-size: var(--t5); line-height: var(--l5); font-weight: 600; box-shadow: var(--shadow-sm); transform-origin: 50% 100%; }
.stage-say::after { content: ""; position: absolute; left: calc((100% + 28px) * .44 - 14px); bottom: -8px; width: 14px; height: 14px; margin-left: -7px; background: var(--bubble); border-right: 1px solid var(--bubble-line); border-bottom: 1px solid var(--bubble-line); transform: rotate(45deg); border-bottom-right-radius: 3px; }
/* 섬 그림은 위쪽 82%만 보여 주고, 가계부를 시작하면 그림 전체로 넓어지며 아래쪽 땅에 텃밭이 생김(ISLE). 건물과 파밍이 자리는 스크립트의 spot으로 계산. 말풍선 꼬리는 파밍이 자리(44%)를 가리킴 */
.island { position: relative; margin: 6px -14px 0; aspect-ratio: 720 / 584; background: url("assets/island.webp") center top / 100% auto no-repeat; }
.zone { position: absolute; padding: 0; border: 0; background: none; border-radius: 16px; }
.zone img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 5px rgb(0 0 0 / .14)); transition: transform .12s; }
.zone:active img { transform: scale(.96); }
.zone .tag { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); white-space: nowrap; font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg); background: var(--bubble); border: 1px solid var(--bubble-line); border-radius: 999px; padding: 2px 10px; box-shadow: var(--shadow-sm); }
.zone .cnt { position: absolute; top: 6%; right: 10%; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; background: var(--bad); color: #FFFFFF; font-family: var(--font-num); font-size: 11px; font-weight: 700; line-height: 22px; text-align: center; box-shadow: 0 0 0 2px var(--paper); }
.island .pal-spot { position: absolute; z-index: 2; }
.island .pal-wrap { display: block; }
.island .pal-btn { width: 100%; }
.island .hero-pal { width: 100%; }
.farm-meta { font-size: var(--t7); line-height: var(--l7); color: var(--fg2); padding: 0 4px; }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.todo li { border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; }
.task-open { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: var(--r-chip); }
.zthumb { width: 44px; height: 44px; object-fit: contain; }
.task-open .t { display: block; font-size: var(--t5); line-height: var(--l5); font-weight: 600; }
.task-open .d { display: block; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.task-open .due { display: inline-block; margin-right: 6px; font-size: var(--t7); line-height: var(--l7); font-weight: 700; color: var(--bad); }
.task-open svg { width: 18px; height: 18px; color: var(--fg3); }
.task-open .go { font-size: var(--t6); line-height: var(--l6); font-weight: 600; background: var(--bg); border-radius: 999px; padding: 6px 14px; }
.todo li.flash .task-open { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--press-strong); } to { background: transparent; } }
.todo-more { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: transparent; padding: 12px 0 4px; border-top: 1px solid var(--line); font-size: var(--t6); line-height: var(--l6); font-weight: 600; color: var(--fg2); text-align: left; }
.todo-more svg { width: 16px; height: 16px; transform: rotate(90deg); transition: transform .2s; }
.todo-more[aria-expanded="true"] svg { transform: rotate(-90deg); }
.todo-done { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.todo-done li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 4px 0; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.todo-done .mini { min-height: 36px; padding: 6px 14px; }
.todo-empty { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.todo-empty b { font-size: var(--t5); line-height: var(--l5); font-weight: 600; }
.todo-empty span { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.latest { background: var(--bg); border-radius: var(--r-chip); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.latest b { font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); }
.latest span { font-size: var(--t5); line-height: var(--l5); font-weight: 600; }

/* 소식과 내 정보 */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.news > li { background: var(--card); border-radius: var(--r-card); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.news .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--t7); line-height: var(--l7); color: var(--fg2); }
.news h3 { margin: 0; font-size: var(--t5); line-height: var(--l5); font-weight: 700; }
.news .msg { background: var(--bg); }
/* 내 정보 줄: 이름과 값만, 줄 전체를 누름 */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rows li + li { border-top: 1px solid var(--line); }
.list-row { width: calc(100% + 16px); margin: 0 -8px; display: grid; grid-template-columns: auto minmax(0, 1fr) 16px; align-items: center; gap: 12px; border: 0; background: transparent; color: var(--fg); padding: 14px 8px; border-radius: var(--r-chip); text-align: left; }
.list-row:active { background: var(--press); }
.list-row .k { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); white-space: nowrap; }
.list-row .v { font-size: var(--t5); line-height: var(--l5); font-weight: 600; text-align: right; text-wrap: balance; }
.list-row .v.empty { color: var(--fg3); font-weight: 500; }
.list-row .v.strong { color: var(--go); font-weight: 700; }
.list-row .stale { display: block; font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); }
.list-row .stale::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.list-row > svg { width: 16px; height: 16px; color: var(--fg3); }
.budget-cta { display: grid; grid-template-columns: 44px minmax(0, 1fr) 16px; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--bg); color: var(--fg); border-radius: var(--r-chip); padding: 14px; }
.budget-cta .e { font-size: 28px; line-height: 1; text-align: center; }
.budget-cta .t { display: block; font-size: var(--t5); line-height: var(--l5); font-weight: 700; }
.budget-cta .d { display: block; font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.budget-cta > svg { width: 16px; height: 16px; color: var(--fg3); }
.todo-more.go-link svg, .todo-more.go-link[aria-expanded] svg { transform: none; }
/* 한 달 예산 */
.bsteps { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-right: 8px; }
.bsteps i { height: 8px; border-radius: 4px; background: var(--line); transition: background-color .3s; }
.bsteps i.on { background: var(--go); }
.money-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 6px 2px; transition: border-color .2s; }
.money-field:focus-within { border-color: var(--go); }
.money { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--fg); font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--t5); line-height: var(--l5); font-weight: 700; text-align: right; outline: none; padding: 0; }
.money::placeholder { color: var(--fg3); }
.money-field > span { font-size: var(--t5); line-height: var(--l5); font-weight: 600; color: var(--fg2); }
.money-field.big .money { font-size: 30px; line-height: 40px; text-align: left; flex: 0 1 auto; width: auto; field-sizing: content; min-width: 1ch; max-width: 100%; }
.money-field.big > span { font-size: var(--t3); }
.chips.add { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.chips.add .chip { min-height: 44px; padding: 8px 4px; justify-content: center; font-size: var(--t6); line-height: var(--l6); font-weight: 600; white-space: nowrap; }
.ce { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--card); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.card .ce { background: var(--bg); }
.cat-add { display: flex; gap: 8px; align-items: center; }
.cat-add input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--chip-line); border-radius: var(--r-chip); padding: 0 14px; font: inherit; font-size: var(--t5); background: var(--bg); color: var(--fg); }
.cat-add .mini { min-height: 48px; }
/* 가계부 시작: 항목 줄 */
.blist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.blist li { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 4px 0; }
.blist li:first-child { border-top: 0; }
.btog { display: flex; align-items: center; gap: 10px; min-height: 56px; border: 0; background: transparent; color: var(--fg); text-align: left; padding: 6px 0; font-size: var(--t5); line-height: var(--l5); font-weight: 600; }
.btog small { display: block; font-size: var(--t7); line-height: var(--l7); color: var(--fg2); font-weight: 500; }
.bbox { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--chip-line); display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
.bbox svg { width: 14px; height: 14px; color: var(--on-go); opacity: 0; }
.btog[aria-pressed="true"] .bbox { background: var(--sel); border-color: var(--sel); }
.btog[aria-pressed="true"] .bbox svg { opacity: 1; }
.blist li:not(.on) .btog .bn { color: var(--fg2); font-weight: 500; }
.bavg { text-align: right; font-size: var(--t7); line-height: var(--l7); color: var(--fg3); }
.chips.row.seg, .chips.row.dows, .chips.row.doms, .chips.row.times { display: grid; gap: 8px; }
.chips.row.seg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chips.row.dows { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chips.row.doms { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chips.row.times { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chips.row.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chips.row.two .chip { min-width: 0; padding: 10px 8px; font-size: var(--t6); line-height: var(--l6); font-weight: 600; text-align: center; text-wrap: balance; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick .sub-h { margin: 0; }
.chips.row.seg .chip, .chips.row.dows .chip, .chips.row.doms .chip, .chips.row.times .chip { min-width: 0; min-height: 48px; padding: 8px 2px; justify-content: center; font-size: var(--t6); line-height: var(--l6); font-weight: 600; white-space: nowrap; }
.chips.row.cats-pick .chip { flex: 0 1 auto; justify-content: flex-start; min-height: 44px; padding: 8px 12px; font-size: var(--t6); }
.push { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
.push-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--go); display: grid; place-items: center; font-size: 22px; }
.push b { display: flex; justify-content: space-between; gap: 8px; font-size: var(--t7); line-height: var(--l7); }
.push b small { font-size: var(--t7); font-weight: 500; color: var(--fg2); }
.push > span:last-child > span { display: block; font-size: var(--t6); line-height: var(--l6); }
/* 가계부 탭 */
.foot.over-tab { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding-bottom: 4px; background: none; }
.pre-steps { list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--card); border-radius: var(--r-card); }
.pre-steps li { display: flex; align-items: center; gap: 12px; font-size: var(--t5); line-height: var(--l5); font-weight: 600; }
.pre-steps .n { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: var(--t7); font-weight: 700; }
.cmp-head, .cmp li { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 8px; align-items: center; }
.cmp-head { font-size: var(--t7); line-height: var(--l7); font-weight: 600; color: var(--fg2); }
.cmp-head span + span, .cmp .cg, .cmp .ca { text-align: right; }
.cmp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cmp li { padding: 10px 0 12px; border-top: 1px solid var(--line); row-gap: 6px; }
.cmp .cn { font-size: var(--t6); line-height: var(--l6); font-weight: 600; min-width: 0; }
.cmp .cg { font-size: var(--t6); line-height: var(--l6); color: var(--fg2); }
.cmp .ca { font-size: var(--t5); line-height: var(--l5); font-weight: 700; }
.cmp li.over .ca { color: var(--bad); }
.cmp .cbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.cmp .cbar i { display: block; height: 100%; border-radius: 3px; background: var(--go); }
.cmp li.over .cbar i { background: var(--bad); }
.cmp li.sum { font-weight: 700; }
.cmp li.sum .cn, .cmp li.sum .cg { font-weight: 700; color: var(--fg); }
.txs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.txs li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "d m v" "d c c"; gap: 2px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.txs li:first-child { border-top: 0; }
.txs .td { grid-area: d; font-size: var(--t7); line-height: var(--l7); color: var(--fg2); align-self: start; padding-top: 2px; }

    const tab = (k, icon, t) => `<button class="tab" data-go="${k}" ${active === k ? 'aria-current="page"' : ''}>${icon}<span>${t}</span>${k === 'news' && unread && active !== 'news' ? `<span class="badge" aria-label="새 소식 ${unread}개">${unread}</span>` : ''}</button>`;
    return `<div class="tabdock"><nav class="tabbar" aria-label="메뉴"><span class="tab-ind" style="--i:${TABS.indexOf(active)}" aria-hidden="true"></span>${tab('home', ICON.home, '홈')}${tab('ledger', ICON.book, '가계부')}${tab('news', ICON.bell, '소식')}${tab('me', ICON.me, '내 정보')}</nav></div>`;
  };
  /* 큰 파밍이 하나가 화면의 주인공. 화면이 바뀌면 같은 파밍이가 새 자리로 미끄러져 감 */
  const heroPal = (id, face, extra = '') => `<span class="pal-wrap"><button class="pal-btn" data-act="pal" aria-label="파밍이 쓰다듬기"><img class="hero-pal" src="${PAL(face)}" alt="파밍이" data-fx="hop" data-fx-id="${id}-pal" data-fx-key="${face}" data-fx-enter="0" ${extra}></button></span>`;
  function duo(id, face, title, sub, opts = {}) {
    return `<div class="duo${opts.lg ? ' lg' : ''}">
      <div class="bubble" data-fx="pop" data-fx-id="${id}-say" data-fx-key="${esc(title + (sub || ''))}"><h2>${title}</h2>${sub ? `<p class="${opts.react ? 'react' : ''}">${sub}</p>` : ''}</div>
      ${heroPal(id, face)}
    </div>`;
  }
  const sheetSay = (face, text) => `<div class="chat"><img class="pal" src="${PAL(face)}" alt=""><div class="msg">${text}</div></div>`;

  /* 시작: 농장 섬 그림, 이름, 한 줄. 약속 세 가지는 쓰이는 자리로 옮김(모르는 건 넘어가기는 인사, 광고비 순서는 계산 화면) */
  function viewStart() {
    return `<div class="splash">
      <div class="splash-art"><img src="assets/splash_farm.webp" alt="파밍이가 서 있는 작은 농장 섬"></div>
      <div><h1>파밍</h1><p>모은 돈을 어디에 두면 더 받는지<br>파밍이가 따져 드려요</p></div>
    </div>
    <div class="foot"><button class="gbtn" data-go="hello">시작하기</button></div>`;
  }

  /* 밭 다섯 칸 진행 표시 */
  const QS = ['q1', 'q2', 'q3', 'q4', 'q5'];
  function plotStages() {
    const s = state.screen, i = QS.indexOf(s);
    if (s === 'calc') return [2, 2, 2, 2, 2];
    if (i < 0) return [0, 0, 0, 0, 0];
    return QS.map((q, k) => k < i ? 2 : k === i && state.sub[q] === 'b' ? 1 : 0);
  }
  function plots() {
    const st = plotStages(), cur = QS.indexOf(state.screen), done = st.filter(v => v === 2).length;
    return `<div class="plots" role="img" aria-label="질문 5개 중 ${done}개 답함">${st.map((v, k) => `<span class="plot${k === cur ? ' cur' : ''}" data-plot="${k}" data-stage="${v}"><i class="soil"></i>${v === 2 ? SPROUT : v === 1 ? SEED : ''}</span>`).join('')}</div>`;
  }
  const qBar = () => `<header class="bar"><div class="bar-in"><button class="back" data-act="back" aria-label="뒤로">${ICON.back}</button>${plots()}</div></header>`;

  /* 인사: 파밍이 소개와 질문 수. 듀오링고 첫 화면처럼 몇 개를 물을지 먼저 말함 */
  function viewHello() {
    return `${qBar()}
    <div class="content hello">
      ${duo('hello', 'moved', '반가워요! 저는 파밍이예요', '질문 5개에 답해 주시면, 지금보다 1년에 얼마를 더 받을 수 있는지 제가 바로 계산해 드려요.', { lg: true })}
      <p class="hello-tip">답할 때마다 위 밭에 새싹이 하나씩 자라요.<br>모르는 건 넘어가도 돼요.</p>
    </div>
    <div class="foot"><button class="gbtn" data-go="q1">반가워요!</button></div>`;
  }

  function qShell(body, cta) {
    return `${qBar()}
    <div class="content">${body}</div>
    <div class="foot"><button class="gbtn" data-act="${cta.act || 'next'}" ${cta.ready ? '' : 'disabled'}>${cta.label}</button></div>`;
  }
  const nextLabel = n => n === 5 ? '결과 보기' : '다음';
  /* 질문 말풍선: 고르기 전에는 묻는 이유, 고른 뒤에는 파밍이 반응 */
  function qDuo(q, title, why) {
    const r = react(q, state.p);
    return duo(q, r ? r[1] : 'base', title, r ? r[0] : why, { react: !!r });
  }
  const answered = (q, k, v) => `<button class="answered" data-sub="${q}" data-fx="rise" data-fx-id="${q}-ans" data-fx-key="${esc(v)}"><span class="k">${k}</span><span class="v">${esc(v)}</span><span class="chg">바꾸기</span></button>`;
  /* 선택지: 화면에 들어오면 하나씩 차례로 떠오름 */
  const gopts = (id, list, isOn, attr, multi) => `<div class="gopts" role="group">${list.map((o, i) => `<button class="gopt${o.ico ? '' : ' plain'}${multi ? ' multi' : ''}" ${attr}="${esc(o.k)}" aria-pressed="${isOn(o.k)}" data-fx="rise" data-fx-id="${id}-${i}" data-fx-key="${id}" data-fx-delay="${60 + i * 45}">${o.ico ? `<span class="gico" aria-hidden="true">${o.ico}</span>` : ''}<span class="gt">${esc(o.t)}</span><span class="gtick" data-fx="tick" data-fx-id="${attr}-${esc(o.k)}" data-fx-key="${isOn(o.k)}" data-fx-only="true" data-fx-enter="0">${ICON.tick}</span></button>`).join('')}</div>`;

  const YEARS = Array.from({ length: 2007 - 1980 + 1 }, (_, i) => 1980 + i);
  const WHEEL_START = 2000;
  function viewQ1() {
    const cur = state.p.birth || WHEEL_START;
    return qShell(`${qDuo('q1', '몇 년생이세요?', '청년 정책은 나이 조건이 있어서 가장 먼저 여쭤봐요.')}
      <div class="wheel-box"><span class="wheel-band" aria-hidden="true"></span>
        <div class="wheel" data-key="wheel" role="listbox" tabindex="0" aria-label="태어난 해" aria-activedescendant="y${cur}">
          <div class="wheel-list">${YEARS.map(y => `<div class="wheel-item${y === cur ? ' on' : ''}" id="y${y}" role="option" aria-selected="${y === cur}" data-year="${y}"><span class="num">${y}</span>년생</div>`).join('')}</div>
        </div>
      </div>`, { ready: true, label: nextLabel(1) });
  }
  function viewQ2() {
    const p = state.p;
    return qShell(`${qDuo('q2', '세금 떼기 전 연봉은 어느 정도예요?', '근로계약서나 원천징수영수증에 적혀 있어요. 정확하지 않아도 괜찮아요.')}
      ${gopts('q2', INCOME, k => p.income === k, 'data-income')}
      <p class="fine">구간은 청년미래적금 기준(3,600만 원, 6,000만 원, 7,500만 원)으로 나눴어요.</p>`, { ready: !!p.income, label: nextLabel(2) });
  }
  /* 두 갈래 질문: 첫 답을 고르면 파밍이가 같은 자리에서 다음 질문을 이어서 물음 */
  function viewQ3() {
    const p = state.p;
    if (state.sub.q3 === 'a') return qShell(`${duo('q3', 'base', '지금 꺼낼 수 있는 돈은 얼마예요?', '입출금 통장, 예금, 적금에 있는 돈을 대략 골라 주세요. 청년도약계좌나 주택청약 같은 정책 상품에 넣은 돈은 꺼내면 혜택이 줄어서 빼 주세요.')}
      ${gopts('q3a', SAVED, k => p.saved === k, 'data-saved')}`, { act: 'sub-next', ready: !!p.saved, label: '다음' });
    return qShell(`${qDuo('q3', '그 돈은 지금 어디에 있어요?', '통장마다 이자가 달라서 여쭤봐요.')}
      ${answered('q3', '꺼낼 수 있는 돈', label(SAVED, p.saved))}
      ${gopts('q3b', WHERE, k => p.where === k, 'data-where')}`, { ready: !!p.where, label: nextLabel(3) });
  }
  function viewQ4() {
    const p = state.p;
    if (state.sub.q4 === 'a') return qShell(`${duo('q4', 'base', '매달 얼마나 모을 수 있어요?', '청년 적금은 매달 넣는 돈에 따라 정부가 더 넣어 줘요.')}
      ${gopts('q4a', MONTHLY, k => p.monthly === k, 'data-monthly')}`, { act: 'sub-next', ready: !!p.monthly, label: '다음' });
    return qShell(`${qDuo('q4', '모아 둔 돈은 언제 쓸 것 같아요?', '예금은 중간에 깨면 은행이 이자를 덜 줘요. 그래서 얼마나 묶어 둘 수 있는지 여쭤봐요.')}
      ${answered('q4', '매달 저축', label(MONTHLY, p.monthly))}
      ${gopts('q4b', WHEN, k => p.when === k, 'data-when')}`, { ready: !!p.when, label: nextLabel(4) });
  }
  function viewQ5() {
    const p = state.p;
    return qShell(`${qDuo('q5', '가입한 정책 상품이 있어요?', '여러 개 골라도 돼요. 갈아탈지 그대로 둘지 제가 따져 볼 때 써요.')}
      ${gopts('q5', PRODUCTS, k => p.products.includes(k), 'data-product', true)}`, { ready: p.products.length > 0, label: nextLabel(5) });
  }

  /* 계산하는 동안: 파밍이가 무엇을 따지는지 하나씩 보여 주고, 끝나면 결과로 넘어감 */
  function viewCalc() {
    const p = state.p, r = ranking(p), s = state.calcStep || 0, found = r.rows[0].value - r.current > 1000;
    const lines = [`예금과 적금 ${DEPOSITS.length}개의 1년 이자 비교`, youthAge(p) ? '청년 정책 가입 조건 확인' : '청년 정책 나이 조건 확인', `지금 두는 곳(${r.where.t})과 비교`];
    const end = s >= lines.length;
    return `<header class="bar"><div class="bar-in">${plots()}</div></header>
    <div class="content hello">
      ${end ? duo('calc', 'surprised', found ? '찾았어요!' : '다 따져 봤어요', found ? '지금보다 더 받는 곳이 있어요.' : '결과를 보여 드릴게요.', { lg: true }) : duo('calc', 'base', '계산하고 있어요', '은행이 내는 광고비와 상관없이, 이자를 많이 주는 순서로 줄 세우고 있어요.', { lg: true })}
      <ul class="calc-list" aria-live="polite">${lines.map((t, i) => `<li class="${s > i ? 'ok' : ''}"><span class="calc-dot" data-fx="tick" data-fx-id="calc-${i}" data-fx-key="${s > i}" data-fx-only="true" data-fx-enter="0">${s > i ? ICON.tick : '<i class="spin"></i>'}</span><span>${esc(t)}</span></li>`).join('')}</ul>
    </div>`;
  }

  function viewResult() {
    const p = state.p, r = ranking(p), top = r.rows[0];
    const gain = top.value - r.current;
    const headline = gain > 1000
      ? `${top.name}에 두면<br>지금보다 1년에 <em data-count="${Math.round(gain)}" data-count-id="gain">${won(gain)}</em> 더 받아요`
      : '지금도 잘 두고 계세요';
    const rows = r.rows.map((d, i) => {
      let extra = '';
      if (d.kind === 'promo') extra = '<span class="flag">광고 금리는 가장 높지만, 3개월 동안 매달 10만 원까지만 넣을 수 있어서 받는 돈은 가장 적어요.</span>';
      if (d.id === 'A' && p.salaryA === null) extra = `<div class="ask"><span>A은행 통장으로 월급을 받으면 금리가 연 3.2%로 올라가요. 지금 A은행으로 월급을 받으세요?</span><button class="mini" data-salary="1">네</button><button class="mini" data-salary="0">아니요</button></div>`;
      if (d.id === 'A' && p.salaryA === true) extra = '<span class="flag good">A은행으로 월급을 받아서 연 3.2%로 계산했어요.</span>';
      if (d.kind === 'park' && r.soon) extra = '<span class="flag good">1년 안에 쓸 수도 있는 돈이라서, 언제든 꺼낼 수 있는 곳을 맨 위에 놓았어요.</span>';
      if (d.kind === 'term' && r.soon) extra += '<span class="flag">만기 전에 꺼내면 약속한 이자보다 적게 받아요.</span>';
      return `<li class="${i === 0 ? 'top' : ''}" data-key="${d.id}" data-flip data-fx="rise" data-fx-id="row-${d.id}" data-fx-key="1" data-fx-delay="${200 + i * 60}">
        <span class="n">${i + 1}</span>
        <div class="main"><span class="name">${d.name}</span></div>
        <span class="won"><span data-count="${Math.round(d.value)}" data-count-id="won-${d.id}">${won(d.value)}</span>${d.kind === 'promo' ? '<small>3개월만</small>' : ''}</span>
        <span class="cond">${d.cond}</span>
        ${extra ? `<div class="extra">${extra}</div>` : ''}</li>`;
    }).join('');
    return `${bar('내 결과', { back: true, demo: true })}
    <div class="content">
      ${duo('result', gain > 1000 ? 'moved' : 'base', headline, gain > 1000 ? `꺼낼 수 있는 돈 ${manwon(r.amt)}으로 계산한, 세금 뗀 금액이에요.` : '더 나은 곳이 생기면 알려드릴게요.', { lg: true })}
      <section class="card" aria-labelledby="h-rank">
        <div class="card-head"><h3 id="h-rank">받을 수 있는 이자</h3><span>${r.soon ? '꺼내기 쉬운 곳 먼저' : '많이 받는 순'}</span></div>
        <div class="tbl">
          <div class="tbl-head" aria-hidden="true"><span>상품</span><span>1년 이자</span></div>
          <ol class="rank">${rows}
            <li class="now" data-key="now" data-flip><span class="n">지금</span><div class="main"><span class="name">지금 그대로</span></div><span class="won">${won(r.current)}</span><span class="cond">${r.where.label}</span></li>
          </ol>
        </div>
        <div class="basis"><span>순서는 1년 동안 세금(15.4%)을 떼고 받는 이자로 정해요. 은행이 광고비를 내도 순서는 바뀌지 않아요.</span><span>꺼낼 수 있는 돈은 고르신 구간 안의 금액으로 계산해요. 500만에서 1,000만 원을 고르셨으면 700만 원으로 계산해요.</span><span>청년도약계좌처럼 정책 상품에 넣은 돈은 꺼내면 혜택이 줄어서, 파밍은 옮길 돈에 넣지 않아요.</span></div>
      </section>
      ${youthCard(p)}
      <section class="card" aria-labelledby="h-isa">
        <div class="card-head"><h3 id="h-isa">ISA</h3><span class="pill pill-mute">제도 안내</span></div>
        <p>ISA(개인종합자산관리계좌)는 이 계좌 안에서 생긴 이자와 수익에 세금이 덜 붙는 통장이에요. 어떤 상품을 담을지는 추천하지 않고 제도만 알려드려요.</p>
      </section>
      <p class="fine">상품명과 금리는 예시예요. 실제 버전은 금융감독원 공시 금리와 기준일을 함께 보여줘요.</p>
    </div>
    <div class="foot"><p class="foot-hint">금리나 제도가 바뀌면 알려 주신 조건으로 다시 계산해 알려드려요.</p><button class="btn btn-primary" data-act="save-profile">저장하고 알림 받기</button></div>`;
  }

  function youthCard(p) {
    const y = youthPlan(p);
    if (!y.ok) return `<section class="card"><div class="card-head"><h3>청년 정책 적금</h3><span class="pill pill-mute">해당 없음</span></div><p>${y.why}</p></section>`;
    if (p.products.includes('doyak')) return doyakCard(p, y);
    let body;
    if (y.monthly === null) {
      body = `<div class="pair"><div><span class="k">일반형이면 매달</span><span class="v num">${won(y.gen)}</span><span class="s">정부가 더 넣어 줌</span></div><div><span class="k">우대형이면 매달</span><span class="v num">${won(y.pref)}</span><span class="s">정부가 더 넣어 줌</span></div></div>`
        + (p.income === 'le36'
          ? `<div class="ask"><span>우대형은 중소기업에 다니면 받을 수 있어요. 회사가 중소기업인가요?</span><button class="mini" data-sme="1">네</button><button class="mini" data-sme="0">아니요</button><button class="mini" data-sme="u">모르겠어요</button></div>`
          : '<p>연봉 구간을 알려 주시면 하나로 정해져요.</p>');
    } else if (y.monthly === 0) {
      body = `<p>${y.note}</p>`;
    } else {
      body = `<div class="pair"><div class="win"><span class="k">${y.type}, 매달</span><span class="v num">${won(y.monthly)}</span><span class="s">정부가 더 넣어 줌</span></div><div><span class="k">3년 동안</span><span class="v num">${won(y.monthly * 36)}</span><span class="s">이자는 따로</span></div></div>`;
    }
    return `<section class="card" aria-labelledby="h-youth">
      <div class="card-head"><h3 id="h-youth">청년미래적금</h3><span class="pill pill-strong">대상일 수 있어요</span></div>
      <p>매달 ${manwon(y.base)}씩 넣는다고 보고 계산했어요.</p>${body}
      <div class="note note-info"><span>지금은 모집 기간이 아니에요. 다음 모집이 열리면 알려 주신 조건으로 다시 계산해 알려드릴게요. 가구 소득 조건은 신청한 뒤 심사 기관이 확인해요.</span></div>
      <div class="basis"><span>정부가 넣어 주는 돈: 일반형은 내가 넣은 돈의 6%(매달 최대 3만 원), 우대형은 12%(매달 최대 6만 원). 3년 동안 매달 50만 원까지 넣을 수 있어요.</span><span>출처: KB Think 청년미래적금 안내, 2026-10-01 기준</span></div>
    </section>`;
  }

  function doyakCard(p, y) {
    let body;
    if (!(p.doyakYear && p.doyakPaid)) {
      body = `<p>갈아탈지 판단하려면 2가지가 더 필요해요. 가입한 해와 지금까지 넣은 돈이에요.</p>
      <button class="btn btn-soft" data-sheet="doyak" style="background:var(--bg)">2가지 알려 주고 비교하기</button>`;
    } else {
      const { left, keep, move, prefOk, keepWins } = doyakCompare(p, y);
      body = `<div class="verdict"><span class="pill pill-warn">예시 판단</span>${keepWins ? '지금은 그대로 두는 게 나아 보여요' : '갈아타기를 따져 볼 만해요'}</div>
      <div class="pair">
        <div class="${keepWins ? 'win' : ''}"><span class="k">유지하면 (남은 ${left}년)</span><span class="v num">${won(keep)}</span><span class="s">남은 기간 정부 기여금, 예시 숫자</span></div>

        fine: `가입은 ${d.bank} 앱에서 직접 하셔야 해요. 파밍은 가입을 대신하지 않고, 은행에서 광고비나 수수료를 받지 않아요.` }
    ], end: `<button class="gbtn" data-act="bank" data-bank="${d.bank}">${d.bank} 앱에서 가입하기</button><button class="btn btn-soft" data-done="move">다 옮겼어요</button>` };
  }
  const storyOf = (screen, p) => STORY_OF[screen] === 'isa' ? isaStory(p) : moveStory(p);

  function viewStory() {
    const s = storyOf(state.screen, state.p), n = s.cards.length, i = Math.min(state.si, n - 1), c = s.cards[i], z = zoneOf(s.zone);
    const q = c.quiz, ans = q ? state.quiz[i] : undefined, done = ans !== undefined, right = done && ans === q.ok;
    const art = q
      ? `<div class="gopts quiz" role="group" aria-label="퀴즈 답">${q.opts.map((t, k) => `<button class="gopt plain${done && k === ans && !right ? ' wrong' : ''}" data-quiz="${k}" aria-pressed="${done && k === q.ok}"${done ? ' aria-disabled="true"' : ''}><span class="gt">${esc(t)}</span><span class="gtick" data-fx="tick" data-fx-id="quiz-${i}-${k}" data-fx-key="${done && k === q.ok}" data-fx-only="true" data-fx-enter="0">${ICON.tick}</span></button>`).join('')}</div>`

    return `<div class="story-top">
        <div class="sbars" role="progressbar" aria-label="이야기 카드" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${i + 1}" aria-valuetext="${n}장 중 ${i + 1}장">${s.cards.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'on cur' : ''}"><b></b></i>`).join('')}</div>
        <div class="story-head"><button class="x" data-act="back" aria-label="닫기">${ICON.close}</button><img src="assets/${z.img}_lv${z.thumb}.webp" alt=""><span><b>${z.name}</b><span>파밍이의 1분 설명</span></span>${s.demo ? '<span class="demo">상품과 금리는 예시</span>' : ''}</div>
      </div>
      <div class="story-body" data-tap>
        ${duo(`st-${state.screen}`, q && done ? (right ? 'moved' : 'sad') : c.face, c.title, q && done ? (right ? q.right : q.wrong) : c.sub, { react: q && done, lg: true })}
        ${art ? `<div class="s-art" data-key="art-${i}" data-fx="rise" data-fx-id="s-art" data-fx-key="${state.sv}">${art}</div>` : ''}
        ${c.note ? `<div class="note note-info" data-key="note-${i}" style="background:var(--bg)"><span>${c.note}</span></div>` : ''}

      </div>
      <div class="foot">${i === n - 1 ? s.end : q && !done ? '<button class="gbtn" disabled>답을 골라 주세요</button>' : '<button class="gbtn" data-act="story-next">다음</button>'}</div>`;
  }
  function storyMove(d) {
    const st = storyOf(state.screen, state.p), i = state.si + d, n = st.cards.length;
    if (i < 0 || i >= n) return;
    if (d > 0 && st.cards[state.si].quiz && state.quiz[state.si] === undefined) { FX.hop(document.querySelector('#app .hero-pal')); return; }
    state.si = i; state.sv++;
    render();
    window.scrollTo(0, 0);
  }

  /* 연봉 축하: 시트가 아니라 화면 전체로. 빛줄기, 튀어나오는 파밍이, 색종이 */
  function viewParty() {
    if (!state.party) state.party = { before: { ...state.p, income: 'le36' }, after: { ...state.p, income: state.p.income === 'le36' ? 'le60' : state.p.income } };
    const { before, after } = state.party, info = partyInfo(before, after);
    const rays = Array.from({ length: 12 }, (_, i) => {
      const a = i * Math.PI / 6, p1 = [150 + Math.cos(a - 0.07) * 150, 150 + Math.sin(a - 0.07) * 150], p2 = [150 + Math.cos(a + 0.07) * 150, 150 + Math.sin(a + 0.07) * 150];
      return `<path d="M150 150 L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z"/>`;
    }).join('');
    return `<div class="content">
      <button class="party-close" data-act="party-close" aria-label="닫기">${ICON.close}</button>
      <div class="party-stage">
        <svg class="rays" viewBox="0 0 300 300" aria-hidden="true" data-fx="fade" data-fx-id="rays" data-fx-key="1">${rays}<circle cx="150" cy="150" r="88"/></svg>

      </div>
      <span class="party-badge" data-fx="rise" data-fx-id="pb" data-fx-key="1" data-fx-delay="420">연봉 구간 올라감</span>

      <p class="lede" data-fx="rise" data-fx-id="pl" data-fx-key="1" data-fx-delay="620">축하해요. 열심히 일한 보람이 있네요.</p>

        <p class="why">${info.why}</p>` : '<p class="why" style="border:0;padding:0">청년 정책 판단은 그대로예요. 예금과 적금 순위도 연봉과 상관없어서 그대로예요.</p>'}
        <button class="link-btn" data-act="edit-monthly">월급이 늘었다면 가계부의 월급도 고쳐 주세요</button>

  }

  /* 받침에 따라 조사 고르기 */
  const josa = (w, yes, no) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 ? yes : no; };

  /* 홈: 섬 위 구역 셋과 가운데 집. 할 일을 마치면 그 할 일의 구역이 한 단계 지어짐 */
  function viewHome() {
    const p = state.p, f = farm(p), next = f.active[0], c = state.cheer;
    let say, face;
    if (c && c.say) { say = c.say; face = 'surprised'; }
    else if (c && c.all) { say = f.house === 3 ? '지금 할 일을 다 마쳤어요! 집도 완성됐어요.' : '지금 할 일을 다 마쳤어요!'; face = 'moved'; }
    else if (c && c.zone) { const z = zoneOf(c.zone); say = `${z.name}${josa(z.name, '이', '가')} 한 단계 지어졌어요!`; face = 'surprised'; }
    else if (state.poke) { say = state.poke[0]; face = state.poke[1]; }
    else if (next) { say = next.say; face = 'base'; }
    else { say = `지금은 할 일이 없어요. ${nextCheck()}에 금리를 다시 볼게요.`; face = 'moved'; }
    const latest = newsItems(p)[0];
    const zone = z => {

      return `<button class="zone" data-zone="${z.k}" style="${spot(...z.pos, z.ratio)}" aria-label="${z.name}, ${z.money}, ${lv}단계${n ? `, 할 일 ${n}개` : ''}">
        <img src="assets/${z.img}_lv${lv}.webp" alt="" data-fx="build" data-fx-id="zone-${z.k}" data-fx-key="${lv}" data-fx-enter="${grow ? 1 : 0}" data-fx-delay="${grow ? 320 : 0}">
        <span class="tag">${z.tag}</span>${n ? `<span class="cnt" aria-hidden="true">${n}</span>` : ''}</button>`;
    };
    const houseUp = !!(c && c.house);
    const house = `<button class="zone zone-home" data-zone="home" style="${spot(...HOUSE.pos, HOUSE.ratio)}" aria-label="파밍이 집, ${f.house}단계">
        <img class="house" src="assets/central_lv${f.house}.webp" alt="" data-fx="build" data-fx-id="house" data-fx-key="${f.house}" data-fx-enter="${houseUp ? 1 : 0}" data-fx-delay="${houseUp ? 560 : 0}"></button>`;

      const tail = t.act === 'notify-on' ? '<span class="go">켜기</span>' : t.act === 'upload' ? '<span class="go">올리기</span>' : ICON.chev;

        <span><span class="t">${esc(t.t)}</span><span class="d">${due}${esc(t.d)}</span></span>${tail}</button></li>`;
    };
    const shown = state.moreTasks ? f.active : f.active.slice(0, HOME_MAX), hidden = f.active.length - shown.length;
    return `${bar('내 농장', { demo: true })}

          <div class="stage-say" data-fx="pop" data-fx-id="stage-say" data-fx-key="${esc(say)}" aria-live="polite">${esc(say)}</div>
          <div class="island" style="aspect-ratio:720 / ${Math.round(712 * crop())}">
            ${zone(ZONES[1])}<span class="pal-spot" style="${spot(...PAL_SPOT.pos, PAL_SPOT.ratio)}">${heroPal('home', face)}</span>${zone(ZONES[0])}${house}${zone(ZONES[2])}${p.budget ? zone(FIELD) : ''}
          </div>
        </div>
        <p class="farm-meta">${p.budget ? '할 일을 마치면 건물이, 소비 내역을 올리면 텃밭이 자라요' : '할 일을 마치면 그 자리 건물이 한 단계 지어져요'}</p>
      </section>
      <section class="card" aria-labelledby="h-todo">
        <div class="card-head"><h3 id="h-todo">내 할 일</h3><span class="num">${f.active.length}개</span></div>
        ${f.active.length ? `<ul class="todo">${shown.map(row).join('')}</ul>` : `<div class="todo-empty"><b>지금은 할 일이 없어요</b><span>${nextCheck()}에 금리와 제도를 다시 확인해요</span></div>`}
        ${hidden > 0 ? `<button class="todo-more" data-act="more-tasks" aria-expanded="false"><span>다음 할 일 ${hidden}개</span>${ICON.chev}</button>` : ''}
        ${state.moreTasks && f.active.length > HOME_MAX ? `<button class="todo-more" data-act="more-tasks" aria-expanded="true"><span>접기</span>${ICON.chev}</button>` : ''}
        ${f.done.length ? `<button class="todo-more" data-act="show-done" aria-expanded="${!!state.showDone}"><span>마친 일 ${f.done.length}개</span>${ICON.chev}</button>` : ''}
        ${state.showDone && f.done.length ? `<ul class="todo-done">${f.done.map(id => { const z = zoneOf(DONE_INFO[id].zone); return `<li data-key="done-${id}"><img class="zthumb" src="assets/${z.img}_lv${z.thumb}.webp" alt="${z.name}"><span>${DONE_INFO[id].t}</span><button class="mini" data-undo="${id}">되돌리기</button></li>`; }).join('')}</ul>` : ''}
      </section>
      <section class="card" aria-labelledby="h-latest">
        <div class="card-head"><h3 id="h-latest">새 소식</h3><button class="mini" data-go="news">모두 보기</button></div>
        <div class="latest"><b class="num">${latest.date} ${latest.tag}</b><span>${latest.title}</span></div>
      </section>
      <button class="btn btn-text" data-go="result">내 결과 다시 보기</button>
    </div>
    ${tabbar('home')}`;
  }

  function viewNews() {
    return `${bar('소식')}
    <div class="content">
      <p class="sub">제도나 금리가 바뀌면 저장해 두신 정보로 제가 다시 계산해서 알려드려요.</p>
      <ul class="news">${newsItems(state.p).map(n => `<li>
        <div class="top"><span class="num">${n.date}</span><span class="pill pill-mute">${n.tag}</span><span class="pill ${n.st[0]}">${n.st[1]}</span></div>

  /* 가계부 시작: 월급, 고정 지출, 생활비 목표, 소비 내역 알림 네 단계. 끝나면 가계부 탭.
     고정 지출은 금액을, 생활비는 한 달 목표를 적음. 고른 항목에는 평균 금액을 미리 넣고 고치게 함 */
  const BSTEPS = ['budget-pay', 'budget-fix', 'budget-live', 'budget-alarm'];
  const ALARM0 = { freq: 'week', dow: 0, dom: 25, time: '21:00' };
  const FREQ = [{ k: 'day', t: '매일' }, { k: 'week', t: '매주' }, { k: 'month', t: '매달' }];
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const DOMS = [1, 10, 15, 25, 'end'];
  const TIMES = [['08:00', '아침 8시'], ['12:00', '낮 12시'], ['18:00', '저녁 6시'], ['21:00', '밤 9시']];
  const PRESELECT = ['phone', 'food', 'move'];
  const alarmWhen = a => a.freq === 'day' ? '매일' : a.freq === 'week' ? `매주 ${DOW[a.dow]}요일` : `매달 ${a.dom === 'end' ? '말일' : `${a.dom}일`}`;
  const alarmText = a => `${alarmWhen(a)} ${(TIMES.find(t => t[0] === a.time) || TIMES[3])[1]}`;
  const alarmSpan = a => a.freq === 'day' ? '오늘' : a.freq === 'week' ? '이번 주' : '이번 달';
  const catOf = (k, b) => [...CATS, ...((b && b.custom) || [])].find(c => c.k === k);
  function bdraft() {
    if (!state.bd) {
      const p = state.p;
      state.bd = p.budget ? JSON.parse(JSON.stringify(p.budget))
        : { pay: null, custom: [], alarm: { ...ALARM0 }, items: PRESELECT.map(k => { const c = catOf(k); return { k, e: c.e, t: c.t, kind: c.kind, v: defAmt(k), auto: true }; }) };
    }
    if (!state.bd.custom) state.bd.custom = [];
    if (!state.bd.alarm) state.bd.alarm = { ...ALARM0 };
    return state.bd;
  }
  const bBar = () => {
    if (state.bdEdit) return `<header class="bar"><div class="bar-in"><button class="back" data-act="back" aria-label="뒤로">${ICON.back}</button><h1>가계부 고치기</h1></div></header>`;
    const i = BSTEPS.indexOf(state.screen);

  };

  const leftText = left => left >= 0 ? `나가는 돈을 빼고 남는 월급 <b class="num">${won(left)}</b>` : `월급보다 <b class="num">${won(-left)}</b> 더 나가요`;
  const bFoot = (label, opts = {}) => `<div class="foot">${opts.left ? `<p class="foot-hint" data-left>${leftText((bdraft().pay || 0) - sumOut(bdraft()))}</p>` : ''}<button class="gbtn" data-act="bnext" ${opts.disabled ? 'disabled' : ''}>${state.bdEdit ? '저장하기' : label}</button></div>`;
  function viewBudgetPay() {

      ${moneyInput('pay', b.pay, '한 달 월급, 통장에 들어오는 돈', 'big')}

      <p class="fine">월급 통장에 들어온 금액이나 급여 명세서의 실지급액을 보면 돼요.</p>

  /* 항목 줄: 왼쪽은 고르기, 오른쪽은 금액. 고르지 않은 항목은 평균 금액을 흐리게 보여 줌 */
  function bRows(kind) {

      const it = b.items.find(x => x.k === c.k), avg = defAmt(c.k);
      return `<li class="${it ? 'on' : ''}" data-key="${esc(c.k)}"><button class="btog" data-tog="${esc(c.k)}" aria-pressed="${!!it}"><span class="bbox" aria-hidden="true">${ICON.tick}</span><span class="ce" aria-hidden="true">${c.e}</span><span class="bn">${esc(c.t)}${c.d ? `<small>${c.d}</small>` : ''}</span></button>
        ${it ? moneyInput(`item:${c.k}`, it.v, `${c.t} ${kind === 'live' ? '한 달 목표' : '한 달 금액'}`, 'sm') : `<span class="bavg">${avg ? `평균 ${won(avg)}` : '직접 적기'}</span>`}</li>`;
    }).join('')}</ul>
    <div class="cat-add"><input data-newcat placeholder="${kind === 'fix' ? '예: 학원비, 기부' : '예: 미용, 취미'}" aria-label="새 항목 이름" maxlength="12"><button class="mini" data-act="add-cat" data-kind="${kind}">더하기</button></div>`;
  }
  function viewBudgetFix() {
    return `${bBar()}
    <div class="content">
      ${duo('bfix', 'base', '매달 꼭 나가는 돈을 골라 주세요', '해당하는 것만 고르시면 돼요. 제가 평균 금액을 넣어 뒀으니 실제 금액으로 고쳐 주세요.')}
      ${bRows('fix')}
      <p class="fine">${AVG_NOTE}</p>
    </div>
    ${bFoot('다음', { left: true })}`;
  }
  function viewBudgetLive() {
    return `${bBar()}
    <div class="content">
      ${duo('blive', 'base', '생활비는 한 달 목표를 정해 주세요', '생활비는 달마다 달라서 목표만 정해 두면 돼요. 나중에 실제로 쓰신 돈과 제가 비교해 드려요.')}
      ${bRows('live')}

  function viewBudgetAlarm() {
    const a = bdraft().alarm;
    const chipRow = (cls, list, attr, cur) => `<div class="chips row ${cls}">${list.map(([k, t]) => `<button class="chip" ${attr}="${k}" aria-pressed="${String(cur) === String(k)}"><span>${t}</span></button>`).join('')}</div>`;

  /* 가계부 탭: 생활비 목표와 실제 쓴 돈을 좌우로 비교. 버튼은 소비 내역 이미지 올리기 */
  const MONTH = TODAY.slice(0, 7);

  const catLabel = (k, b) => { const c = catOf(k, b); return c ? `${c.e} ${c.t}` : '🧾 기타'; };
  function viewLedger() {

    const etc = rec.filter(x => !b.items.some(it => it.k === x.cat)).reduce((n, x) => n + x.amount, 0);

  /* 소비 내역 읽기: 게시된 시안에서는 보는 사람의 Claude가 사진을 읽음. 읽을 수 없는 곳(파일로 연 시안, 허용 안 함)에서는 예시 내역 */

      <section class="card" aria-label="찾은 내역"><ul class="txs">${f.list.map((x, i) => `<li data-key="tx${i}"><span class="td num">${x.date.slice(5).replace('-', '.')}</span><span class="tm">${esc(x.merchant)}</span><span class="tv num">${won(x.amount)}</span><button class="tcat" data-txcat="${i}" aria-label="${esc(x.merchant)} 항목 바꾸기, 지금 ${catLabel(x.cat, b)}">${catLabel(x.cat, b)}</button></li>`).join('')}</ul></section>

  /* 내 정보: 한 줄에 이름과 값만. 줄을 누르면 그 자리에서 고르는 시트가 뜨고, 고르면 바로 저장하고 무엇이 바뀌었는지 알려 줌 */
  const ME_GROUPS = [
    { t: '나', rows: ['birth', 'income', 'sme'] },
    { t: '모은 돈', rows: ['saved', 'where', 'monthly', 'when'] },

  ];

  const fieldOf = f => FIELDS.find(x => x.f === f);
  function viewMe() {

      <p class="fine">누르면 바로 고칠 수 있어요. 고치시면 제가 다시 계산해서 바뀐 점을 알려드려요.</p>

        <button class="todo-more" data-act="show-log" aria-expanded="${state.showLog}"><span>바꾼 기록 ${state.log.length}개</span>${ICON.chev}</button>
        ${state.showLog ? `<ul class="log">${state.log.map(l => `<li><span class="num">${l.d}</span><span>${esc(l.t)}</span></li>`).join('')}</ul>` : ''}
        ${state.confirmWipe

          : '<button class="btn btn-text danger" data-act="wipe-ask">내 정보 모두 지우기</button>'}

  const VIEWS = { ledger: viewLedger, 'budget-pay': viewBudgetPay, 'budget-fix': viewBudgetFix, 'budget-live': viewBudgetLive, 'budget-alarm': viewBudgetAlarm, scan: viewScan, 'scan-check': viewScanCheck, start: viewStart, hello: viewHello, q1: viewQ1, q2: viewQ2, q3: viewQ3, q4: viewQ4, q5: viewQ5, calc: viewCalc, result: viewResult, home: viewHome, product: viewStory, isa: viewStory, news: viewNews, me: viewMe, party: viewParty };

  /* 그리기: 화면이 바뀌면 통째로 바꾸고 들어오는 움직임을 줌. 같은 화면 안의 변화는 바뀐 부분만 고쳐서 전환 효과가 이어지게 함 */
  function morph(from, to) {
    for (const { name } of [...from.attributes]) if (!to.hasAttribute(name)) from.removeAttribute(name);
    for (const { name, value } of [...to.attributes]) if (from.getAttribute(name) !== value) from.setAttribute(name, value);
    morphKids(from, to);
  }
  function morphKids(from, to) {
    const a = [...from.childNodes], b = [...to.childNodes];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const x = a[i], y = b[i];
      if (!x) { from.appendChild(y); continue; }
      if (!y) { from.removeChild(x); continue; }
      const same = x.nodeType === y.nodeType && x.nodeName === y.nodeName && (x.nodeType !== 1 || x.getAttribute('data-key') === y.getAttribute('data-key'));
      if (!same) { from.replaceChild(y, x); continue; }
      if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
      morph(x, y);
    }
  }

  const anim = (el, frames, opts) => { if (el && !REDUCED() && el.animate) return el.animate(frames, { easing: EASE, ...opts }); return null; };
  const delayOf = el => Number(el.dataset.fxDelay || 0);
  const FX = {
    hop: el => anim(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-12px) rotate(-3deg)', offset: .35 }, { transform: 'translateY(0)', offset: .7 }, { transform: 'translateY(-3px)', offset: .85 }, { transform: 'translateY(0)' }], { duration: 560 }),
    pop: el => anim(el, [{ transform: 'scale(.92)', opacity: .2 }, { transform: 'scale(1.02)', opacity: 1, offset: .7 }, { transform: 'scale(1)' }], { duration: 360 }),
    tick: el => anim(el, [{ transform: 'scale(.6)' }, { transform: 'scale(1.18)', offset: .6 }, { transform: 'scale(1)' }], { duration: 340 }),
