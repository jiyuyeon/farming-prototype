        art: `<ol class="steps"><li>은행이나 증권사 앱에서 신탁형 ISA 만들기</li><li>ISA에 돈 넣기, 1년에 2,000만 원까지</li><li>ISA 안에서 정기예금 고르기</li></ol>
          <p class="s-cap">예금은 신탁형 ISA에만 담을 수 있어요. 어떤 예금을 담을 수 있는지와 수수료는 은행과 증권사마다 달라요. 파밍은 펀드나 주식 같은 투자 상품을 추천하지 않아요.</p>`,
        note: '정부가 청년형 ISA를 새로 만들려고 해요. 국회에서 정해지면 알려 주신 조건으로 다시 계산해서 알려드릴게요.', fine: '출처: 국회예산정책처 나보포커스 156호(2026-04-30), 2026년 세법개정안 보도(2026-08)' }
    ], end: '<button class="gbtn" data-done="isa">알았어요</button><button class="btn btn-text" data-act="back">나중에 다시 볼게요</button>' };
  }

  function moveStory(p) {
    const r = ranking(p), d = r.rows[0], gain = d.value - r.current, amt = manwon(r.amt);
    const keep = d.kind === 'park'
      ? { face: 'moved', title: '파킹통장은<br>언제든 꺼낼 수 있어요', sub: '만기가 없어서, 중간에 꺼내도 은행이 이자를 깎지 않아요.', art: fit(true, '1년 안에 쓸 수도 있는 돈에 잘 맞아요', '') }
      : d.kind === 'promo'
        ? { face: 'base', title: '특판 적금은 3개월 동안<br>매달 10만 원까지만 넣어요', sub: '금리는 높지만 넣을 수 있는 돈이 적어서 받는 이자도 적어요.', art: '' }
        : { face: 'base', title: '정기예금은 1년 동안<br>꺼내지 않는 게 좋아요', sub: '만기 전에 꺼내시면 은행이 약속한 이자보다 적게 줘요.',
          art: years(['3개월', '6개월', '9개월', '1년'], '1년을 채우면 약속한 이자를 다 받아요') + fit(!r.soon, '1년 넘게 둘 돈이라고 하셔서 잘 맞아요', '1년 안에 쓸 돈은 빼고 옮기세요') };
    return { zone: 'barn', demo: true, cards: [
      { face: 'surprised', title: gain >= GAIN_MIN ? `${d.bank}에 옮기면<br>1년에 <em data-count="${Math.round(gain)}" data-count-id="st-gain">${won(gain)}</em> 더 받아요` : `${d.bank} 조건을<br>정리했어요`, sub: `지금 ${r.where.n}에 두신 ${amt}으로 계산한, 세금 뗀 이자예요.`,
        art: cmpBars([['지금', r.current], ['옮기면', d.value]]) },
      { face: 'base', title: `${d.bank.includes('저축은행') ? '저축은행 예금도' : '은행 예금은'}<br>1억 원까지 돌려받아요`, sub: `${d.bank}${josa(d.bank, '이', '가')} 문을 닫아도, 예금보험공사가 원금과 이자를 합쳐 한 사람당 1억 원까지 돌려줘요.`,
        art: `<div class="pair"><div><span class="k">지켜 주는 돈</span><span class="v num">1억 원</span><span class="s">한 사람, 한 은행마다</span></div><div class="win"><span class="k">내 돈</span><span class="v num">${amt}</span><span class="s">모두 지켜져요</span></div></div>
          <p class="s-cap">이 한도를 예금자보호라고 해요. 2025년 9월 1일부터 5,000만 원에서 1억 원으로 올랐어요.</p>` },
      keep,
      { face: 'base', title: `퀴즈! ${d.bank}${josa(d.bank, '이', '가')} 문을 닫으면 넣어 두신 ${amt}은?`, sub: '골라 보세요.',
        quiz: { opts: ['모두 돌려받아요', '못 받을 수도 있어요'], ok: 0, right: '맞아요! 1억 원까지는 예금보험공사가 돌려줘요.', wrong: '걱정 마세요. 1억 원까지는 예금보험공사가 돌려줘요.' } },
      { face: 'moved', title: '조건은 제가<br>확인해 뒀어요', sub: '가입만 은행 앱에서 해 주세요.',
        art: `<ul class="facts">
          <li><span class="k">상품</span><span class="v">${d.name}</span></li>
          <li><span class="k">금리</span><span class="v">연 ${(d.rate * 100).toFixed(1)}%, ${TERM[d.kind]}</span></li>
          <li><span class="k">가입 대상</span><span class="v">누구나</span></li>
          <li><span class="k">추가 금리 조건</span><span class="v">${d.extra}</span></li>
          <li><span class="k">기준일</span><span class="v num">${TODAY} 예시</span></li></ul>`,
        fine: `가입은 ${d.bank} 앱에서 직접 하셔야 해요. 파밍은 가입을 대신하지 않고, 은행에서 광고비나 수수료를 받지 않아요.` }
    ], end: `<button class="gbtn" data-act="bank" data-bank="${d.bank}">${d.bank} 앱에서 가입하기</button><button class="btn btn-soft" data-done="move">다 옮겼어요</button>` };
  }
  const storyOf = (screen, p) => STORY_OF[screen] === 'isa' ? isaStory(p) : moveStory(p);

  function viewStory() {
    const s = storyOf(state.screen, state.p), n = s.cards.length, i = Math.min(state.si, n - 1), c = s.cards[i], z = zoneOf(s.zone);
    const q = c.quiz, ans = q ? state.quiz[i] : undefined, done = ans !== undefined, right = done && ans === q.ok;
    const art = q
      ? `<div class="gopts quiz" role="group" aria-label="퀴즈 답">${q.opts.map((t, k) => `<button class="gopt plain${done && k === ans && !right ? ' wrong' : ''}" data-quiz="${k}" aria-pressed="${done && k === q.ok}"${done ? ' aria-disabled="true"' : ''}><span class="gt">${esc(t)}</span><span class="gtick" data-fx="tick" data-fx-id="quiz-${i}-${k}" data-fx-key="${done && k === q.ok}" data-fx-only="true" data-fx-enter="0">${ICON.tick}</span></button>`).join('')}</div>`
      : c.art;
    return `<div class="story-top">
        <div class="sbars" role="progressbar" aria-label="이야기 카드" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${i + 1}" aria-valuetext="${n}장 중 ${i + 1}장">${s.cards.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'on cur' : ''}"><b></b></i>`).join('')}</div>
        <div class="story-head"><button class="x" data-act="back" aria-label="닫기">${ICON.close}</button><img src="assets/${z.img}_lv${z.thumb}.webp" alt=""><span><b>${z.name}</b><span>파밍이의 1분 설명</span></span>${s.demo ? '<span class="demo">상품과 금리는 예시</span>' : ''}</div>
      </div>
      <div class="story-body" data-tap>
        ${duo(`st-${state.screen}`, q && done ? (right ? 'moved' : 'sad') : c.face, c.title, q && done ? (right ? q.right : q.wrong) : c.sub, { react: q && done, lg: true })}
        ${art ? `<div class="s-art" data-key="art-${i}" data-fx="rise" data-fx-id="s-art" data-fx-key="${state.sv}">${art}</div>` : ''}
        ${c.note ? `<div class="note note-info" data-key="note-${i}" style="background:var(--bg)"><span>${c.note}</span></div>` : ''}
        ${c.fine ? `<p class="fine" data-key="fine-${i}">${c.fine}</p>` : ''}
      </div>
      <div class="foot">${i === n - 1 ? s.end : q && !done ? '<button class="gbtn" disabled>답을 골라 주세요</button>' : '<button class="gbtn" data-act="story-next">다음</button>'}</div>`;
  }
  function storyMove(d) {
    const st = storyOf(state.screen, state.p), i = state.si + d, n = st.cards.length;
    if (i < 0 || i >= n) return;
    if (d > 0 && st.cards[state.si].quiz && state.quiz[state.si] === undefined) { FX.hop(document.querySelector('#app .hero-pal')); return; }
    state.si = i; state.sv++;
    render();
    window.scrollTo(0, 0);
  }

  /* 연봉 축하: 시트가 아니라 화면 전체로. 빛줄기, 튀어나오는 파밍이, 색종이 */
  function viewParty() {
    if (!state.party) state.party = { before: { ...state.p, income: 'le36' }, after: { ...state.p, income: state.p.income === 'le36' ? 'le60' : state.p.income } };
    const { before, after } = state.party, info = partyInfo(before, after);
    const rays = Array.from({ length: 12 }, (_, i) => {
      const a = i * Math.PI / 6, p1 = [150 + Math.cos(a - 0.07) * 150, 150 + Math.sin(a - 0.07) * 150], p2 = [150 + Math.cos(a + 0.07) * 150, 150 + Math.sin(a + 0.07) * 150];
      return `<path d="M150 150 L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z"/>`;
    }).join('');
    return `<div class="content">
      <button class="party-close" data-act="party-close" aria-label="닫기">${ICON.close}</button>
      <div class="party-stage">
        <svg class="rays" viewBox="0 0 300 300" aria-hidden="true" data-fx="fade" data-fx-id="rays" data-fx-key="1">${rays}<circle cx="150" cy="150" r="88"/></svg>
        <img class="hero-pal" id="party-pal" src="${PAL('surprised')}" alt="놀라서 기뻐하는 파밍이" data-fx="spring" data-fx-id="party-pal" data-fx-key="1">
      </div>
      <span class="party-badge" data-fx="rise" data-fx-id="pb" data-fx-key="1" data-fx-delay="420">연봉 구간 올라감</span>
      <h2 data-fx="rise" data-fx-id="ph" data-fx-key="1" data-fx-delay="520">와, 연봉이 올랐네요!</h2>
      <p class="lede" data-fx="rise" data-fx-id="pl" data-fx-key="1" data-fx-delay="620">축하해요. 열심히 일한 보람이 있네요.</p>
      <section class="party-card" data-fx="rise" data-fx-id="pc" data-fx-key="1" data-fx-delay="740" aria-labelledby="h-delta">
        <h3 id="h-delta">${info.rows.length ? '그래서 이렇게 바뀌어요' : '바뀌는 건 없어요'}</h3>
        ${info.rows.length ? `<ul class="delta">${info.rows.map(([k, a, b]) => `<li><span class="k">${k}</span><span class="v"><s>${a}</s>${ICON.arrow}<span>${b}</span></span></li>`).join('')}</ul>
        <p class="why">${info.why}</p>` : '<p class="why" style="border:0;padding:0">청년 정책 판단은 그대로예요. 예금과 적금 순위도 연봉과 상관없어서 그대로예요.</p>'}
        <button class="link-btn" data-act="edit-monthly">월급이 늘었다면 가계부의 월급도 고쳐 주세요</button>
      </section>
    </div>
    <div class="foot" data-fx="rise" data-fx-id="pf" data-fx-key="1" data-fx-delay="860"><button class="btn btn-primary" data-act="to-result">바뀐 결과 보기</button></div>`;
  }

  /* 받침에 따라 조사 고르기 */
  const josa = (w, yes, no) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 ? yes : no; };

  /* 홈: 섬 위 구역 셋과 가운데 집. 할 일을 마치면 그 할 일의 구역이 한 단계 지어짐 */
  function viewHome() {
    const p = state.p, f = farm(p), next = f.active[0], c = state.cheer;
    let say, face;
    if (c && c.say) { say = c.say; face = 'surprised'; }
    else if (c && c.all) { say = f.house === 3 ? '지금 할 일을 다 마쳤어요! 집도 완성됐어요.' : '지금 할 일을 다 마쳤어요!'; face = 'moved'; }
    else if (c && c.zone) { const z = zoneOf(c.zone); say = `${z.name}${josa(z.name, '이', '가')} 한 단계 지어졌어요!`; face = 'surprised'; }
    else if (state.poke) { say = state.poke[0]; face = state.poke[1]; }
    else if (next) { say = next.say; face = 'base'; }
    else { say = `지금은 할 일이 없어요. ${nextCheck()}에 금리를 다시 볼게요.`; face = 'moved'; }
    const latest = newsItems(p)[0];
    const zone = z => {
      const lv = f.lv[z.k], n = f.active.filter(t => t.zone === z.k).length, grow = !!(c && c.zone === z.k);
      return `<button class="zone" data-zone="${z.k}" style="${spot(...z.pos, z.ratio)}" aria-label="${z.name}, ${z.money}, ${lv}단계${n ? `, 할 일 ${n}개` : ''}">
        <img src="assets/${z.img}_lv${lv}.webp" alt="" data-fx="build" data-fx-id="zone-${z.k}" data-fx-key="${lv}" data-fx-enter="${grow ? 1 : 0}" data-fx-delay="${grow ? 320 : 0}">
        <span class="tag">${z.tag}</span>${n ? `<span class="cnt" aria-hidden="true">${n}</span>` : ''}</button>`;
    };
    const houseUp = !!(c && c.house);
    const house = `<button class="zone zone-home" data-zone="home" style="${spot(...HOUSE.pos, HOUSE.ratio)}" aria-label="파밍이 집, ${f.house}단계">
        <img class="house" src="assets/central_lv${f.house}.webp" alt="" data-fx="build" data-fx-id="house" data-fx-key="${f.house}" data-fx-enter="${houseUp ? 1 : 0}" data-fx-delay="${houseUp ? 560 : 0}"></button>`;
    const row = t => {
      const z = zoneOf(t.zone);
      const target = t.open ? `data-go="${t.open}"` : t.held ? `data-held="${t.held}"` : t.sheet ? `data-sheet="${t.sheet}"` : `data-act="${t.act}"`;
      const tail = t.act === 'notify-on' ? '<span class="go">켜기</span>' : t.act === 'upload' ? '<span class="go">올리기</span>' : ICON.chev;
      const due = t.due ? `<span class="due">마감 D-${Math.max(0, Math.round((new Date(t.due) - new Date(TODAY)) / 864e5))}</span>` : '';
      return `<li data-key="${t.id}" data-zone-row="${t.zone}"><button class="task-open" ${target}><img class="zthumb" src="assets/${z.img}_lv${z.thumb}.webp" alt="${z.name}">
        <span><span class="t">${esc(t.t)}</span><span class="d">${due}${esc(t.d)}</span></span>${tail}</button></li>`;
    };
    const shown = state.moreTasks ? f.active : f.active.slice(0, HOME_MAX), hidden = f.active.length - shown.length;
    return `${bar('내 농장', { demo: true })}
    <div class="content">
      <section class="farm" aria-label="농장">
        <div class="farm-stage">
          <div class="stage-say" data-fx="pop" data-fx-id="stage-say" data-fx-key="${esc(say)}" aria-live="polite">${esc(say)}</div>
          <div class="island" style="aspect-ratio:720 / ${Math.round(712 * crop())}">
            ${zone(ZONES[1])}<span class="pal-spot" style="${spot(...PAL_SPOT.pos, PAL_SPOT.ratio)}">${heroPal('home', face)}</span>${zone(ZONES[0])}${house}${zone(ZONES[2])}${p.budget ? zone(FIELD) : ''}
          </div>
        </div>
        <p class="farm-meta">${p.budget ? '할 일을 마치면 건물이, 소비 내역을 올리면 텃밭이 자라요' : '할 일을 마치면 그 자리 건물이 한 단계 지어져요'}</p>
      </section>
      <section class="card" aria-labelledby="h-todo">
        <div class="card-head"><h3 id="h-todo">내 할 일</h3><span class="num">${f.active.length}개</span></div>
        ${f.active.length ? `<ul class="todo">${shown.map(row).join('')}</ul>` : `<div class="todo-empty"><b>지금은 할 일이 없어요</b><span>${nextCheck()}에 금리와 제도를 다시 확인해요</span></div>`}
        ${hidden > 0 ? `<button class="todo-more" data-act="more-tasks" aria-expanded="false"><span>다음 할 일 ${hidden}개</span>${ICON.chev}</button>` : ''}
        ${state.moreTasks && f.active.length > HOME_MAX ? `<button class="todo-more" data-act="more-tasks" aria-expanded="true"><span>접기</span>${ICON.chev}</button>` : ''}
        ${f.done.length ? `<button class="todo-more" data-act="show-done" aria-expanded="${!!state.showDone}"><span>마친 일 ${f.done.length}개</span>${ICON.chev}</button>` : ''}
        ${state.showDone && f.done.length ? `<ul class="todo-done">${f.done.map(id => { const z = zoneOf(DONE_INFO[id].zone); return `<li data-key="done-${id}"><img class="zthumb" src="assets/${z.img}_lv${z.thumb}.webp" alt="${z.name}"><span>${DONE_INFO[id].t}</span><button class="mini" data-undo="${id}">되돌리기</button></li>`; }).join('')}</ul>` : ''}
      </section>
      <section class="card" aria-labelledby="h-latest">
        <div class="card-head"><h3 id="h-latest">새 소식</h3><button class="mini" data-go="news">모두 보기</button></div>
        <div class="latest"><b class="num">${latest.date} ${latest.tag}</b><span>${latest.title}</span></div>
      </section>
      <button class="btn btn-text" data-go="result">내 결과 다시 보기</button>
    </div>
    ${tabbar('home')}`;
  }

  function viewNews() {
    return `${bar('소식')}
    <div class="content">
      <p class="sub">제도나 금리가 바뀌면 저장해 두신 정보로 제가 다시 계산해서 알려드려요.</p>
      <ul class="news">${newsItems(state.p).map(n => `<li>
        <div class="top"><span class="num">${n.date}</span><span class="pill pill-mute">${n.tag}</span><span class="pill ${n.st[0]}">${n.st[1]}</span></div>
        <h3>${n.title}</h3>
        <div class="chat"><img class="pal" src="${PAL('base')}" alt=""><div class="msg"><b>나에게는</b>${n.me}</div></div>
        <span class="fine">출처: ${n.src}</span>
      </li>`).join('')}</ul>
    </div>
    ${tabbar('news')}`;
  }

  /* 가계부 시작: 월급, 고정 지출, 생활비 목표, 소비 내역 알림 네 단계. 끝나면 가계부 탭.
     고정 지출은 금액을, 생활비는 한 달 목표를 적음. 고른 항목에는 평균 금액을 미리 넣고 고치게 함 */
  const BSTEPS = ['budget-pay', 'budget-fix', 'budget-live', 'budget-alarm'];
  const ALARM0 = { freq: 'week', dow: 0, dom: 25, time: '21:00' };
  const FREQ = [{ k: 'day', t: '매일' }, { k: 'week', t: '매주' }, { k: 'month', t: '매달' }];
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const DOMS = [1, 10, 15, 25, 'end'];
  const TIMES = [['08:00', '아침 8시'], ['12:00', '낮 12시'], ['18:00', '저녁 6시'], ['21:00', '밤 9시']];
  const PRESELECT = ['phone', 'food', 'move'];
  const alarmWhen = a => a.freq === 'day' ? '매일' : a.freq === 'week' ? `매주 ${DOW[a.dow]}요일` : `매달 ${a.dom === 'end' ? '말일' : `${a.dom}일`}`;
  const alarmText = a => `${alarmWhen(a)} ${(TIMES.find(t => t[0] === a.time) || TIMES[3])[1]}`;
  const alarmSpan = a => a.freq === 'day' ? '오늘' : a.freq === 'week' ? '이번 주' : '이번 달';
  const catOf = (k, b) => [...CATS, ...((b && b.custom) || [])].find(c => c.k === k);
  function bdraft() {
    if (!state.bd) {
      const p = state.p;
      state.bd = p.budget ? JSON.parse(JSON.stringify(p.budget))
        : { pay: null, custom: [], alarm: { ...ALARM0 }, items: PRESELECT.map(k => { const c = catOf(k); return { k, e: c.e, t: c.t, kind: c.kind, v: defAmt(k), auto: true }; }) };
    }
    if (!state.bd.custom) state.bd.custom = [];
    if (!state.bd.alarm) state.bd.alarm = { ...ALARM0 };
    return state.bd;
  }
  const bBar = () => {
    if (state.bdEdit) return `<header class="bar"><div class="bar-in"><button class="back" data-act="back" aria-label="뒤로">${ICON.back}</button><h1>가계부 고치기</h1></div></header>`;
    const i = BSTEPS.indexOf(state.screen);
    return `<header class="bar"><div class="bar-in"><button class="back" data-act="back" aria-label="뒤로">${ICON.back}</button>
      <div class="bsteps" role="progressbar" aria-label="가계부 시작 단계" aria-valuemin="1" aria-valuemax="${BSTEPS.length}" aria-valuenow="${i + 1}">${BSTEPS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div></div></header>`;
  };
  const moneyInput = (key, v, aria, cls = '') => `<label class="money-field ${cls}"><input class="money" data-money="${key}" inputmode="numeric" autocomplete="off" aria-label="${esc(aria)}" value="${v ? v.toLocaleString('ko-KR') : ''}" placeholder="0"><span>원</span></label>`;
  const leftText = left => left >= 0 ? `나가는 돈을 빼고 남는 월급 <b class="num">${won(left)}</b>` : `월급보다 <b class="num">${won(-left)}</b> 더 나가요`;
  const bFoot = (label, opts = {}) => `<div class="foot">${opts.left ? `<p class="foot-hint" data-left>${leftText((bdraft().pay || 0) - sumOut(bdraft()))}</p>` : ''}<button class="gbtn" data-act="bnext" ${opts.disabled ? 'disabled' : ''}>${state.bdEdit ? '저장하기' : label}</button></div>`;
  function viewBudgetPay() {
    const b = bdraft();
    return `${bBar()}
    <div class="content">
      ${duo('bpay', 'base', '한 달에 월급이 얼마 들어와요?', '세금과 4대 보험을 떼고 통장에 들어오는 돈이에요.')}
      ${moneyInput('pay', b.pay, '한 달 월급, 통장에 들어오는 돈', 'big')}
      <p class="hanwon" data-han aria-hidden="true">${hanWon(b.pay)}</p>
      <div class="chips row add">${[100000, 500000, 1000000].map(v => `<button class="chip" data-add="${v}"><span>+${manwon(v)}</span></button>`).join('')}<button class="chip" data-add="0"><span>지우기</span></button></div>
      <p class="fine">월급 통장에 들어온 금액이나 급여 명세서의 실지급액을 보시면 돼요. 청년 정책 조건은 세금 떼기 전 연봉으로 정해져서 앞에서 연봉 구간을 여쭤봤어요. 한 달 예산은 통장에 들어오는 이 금액으로 제가 계산해 드려요.</p>
    </div>
    ${bFoot('다음', { disabled: !b.pay })}`;
  }
  /* 항목 줄: 왼쪽은 고르기, 오른쪽은 금액. 고르지 않은 항목은 평균 금액을 흐리게 보여 줌 */
  function bRows(kind) {
    const b = bdraft(), p = state.p;
    const list = [...CATS, ...b.custom].filter(c => kindOf(c) === kind);
    return `<ul class="blist" aria-label="${kind === 'fix' ? '고정 지출 항목' : '생활비 항목'}">${list.map(c => {
      const it = b.items.find(x => x.k === c.k), avg = defAmt(c.k);
      return `<li class="${it ? 'on' : ''}" data-key="${esc(c.k)}"><button class="btog" data-tog="${esc(c.k)}" aria-pressed="${!!it}"><span class="bbox" aria-hidden="true">${ICON.tick}</span><span class="ce" aria-hidden="true">${c.e}</span><span class="bn">${esc(c.t)}${c.d ? `<small>${c.d}</small>` : ''}</span></button>
        ${it ? moneyInput(`item:${c.k}`, it.v, `${c.t} ${kind === 'live' ? '한 달 목표' : '한 달 금액'}`, 'sm') : `<span class="bavg">${avg ? `평균 ${won(avg)}` : '직접 적기'}</span>`}</li>`;
    }).join('')}</ul>
    <div class="cat-add"><input data-newcat placeholder="${kind === 'fix' ? '예: 학원비, 기부' : '예: 미용, 취미'}" aria-label="새 항목 이름" maxlength="12"><button class="mini" data-act="add-cat" data-kind="${kind}">더하기</button></div>`;
  }
  function viewBudgetFix() {
    return `${bBar()}
    <div class="content">
      ${duo('bfix', 'base', '매달 꼭 나가는 돈을 골라 주세요', '해당하는 것만 고르시면 돼요. 제가 평균 금액을 넣어 뒀으니 실제 금액으로 고쳐 주세요.')}
      ${bRows('fix')}
      <p class="fine">${AVG_NOTE}</p>
    </div>
    ${bFoot('다음', { left: true })}`;
  }
  function viewBudgetLive() {
    return `${bBar()}
    <div class="content">
      ${duo('blive', 'base', '생활비는 한 달 목표를 정해 주세요', '생활비는 달마다 달라서 목표만 정해 두면 돼요. 나중에 실제로 쓰신 돈과 제가 비교해 드려요.')}
      ${bRows('live')}
      <p class="fine">${AVG_NOTE}</p>
    </div>
    ${bFoot('다음', { left: true })}`;
  }
  function viewBudgetAlarm() {
    const a = bdraft().alarm;
    const chipRow = (cls, list, attr, cur) => `<div class="chips row ${cls}">${list.map(([k, t]) => `<button class="chip" ${attr}="${k}" aria-pressed="${String(cur) === String(k)}"><span>${t}</span></button>`).join('')}</div>`;
    return `${bBar()}
    <div class="content">
      ${duo('balarm', 'base', '소비 내역 알림은 언제 보낼까요?', '정하신 때에 제가 알림을 보내면, 은행 앱 소비 내역을 캡처해서 올려 주세요. 제가 읽고 목표와 비교해 드려요.')}
      ${chipRow('seg', FREQ.map(f => [f.k, f.t]), 'data-freq', a.freq)}
      ${a.freq === 'week' ? `<h3 class="cat-h">요일</h3>${chipRow('dows', DOW.map((d, i) => [i, d]), 'data-dow', a.dow)}` : ''}
      ${a.freq === 'month' ? `<h3 class="cat-h">날짜</h3>${chipRow('doms', DOMS.map(d => [d, d === 'end' ? '말일' : `${d}일`]), 'data-dom', a.dom)}` : ''}
      <h3 class="cat-h">시간</h3>${chipRow('times', TIMES, 'data-time', a.time)}
      <div class="push" aria-label="알림 미리 보기"><span class="push-ico" aria-hidden="true">🌱</span><span><b>파밍 <small>${alarmText(a)}</small></b><span>${alarmSpan(a)} 소비 내역을 올려 주세요. 목표와 비교해 드릴게요.</span></span></div>
    </div>
    ${bFoot('알림 받고 가계부 시작하기')}`;
  }

  /* 가계부 탭: 생활비 목표와 실제 쓴 돈을 좌우로 비교. 버튼은 소비 내역 이미지 올리기 */
  const MONTH = TODAY.slice(0, 7);
  const spendNow = () => (state.spend || []).filter(x => x.date.slice(0, 7) === MONTH);
  const catLabel = (k, b) => { const c = catOf(k, b); return c ? `${c.e} ${c.t}` : '🧾 기타'; };
  function viewLedger() {
    const p = state.p;
    if (!p.budget) return `${bar('가계부')}
    <div class="content">
      ${duo('ledger', 'base', '가계부를 시작해요', '월급과 매달 나가는 돈을 정해 주시면, 제가 소비 내역 사진을 읽고 목표와 실제로 쓰신 돈을 비교해 드려요.', { lg: true })}
      <ol class="pre-steps">${['월급', '고정 지출', '생활비 목표', '소비 내역 알림'].map((t, i) => `<li><span class="n num">${i + 1}</span>${t}</li>`).join('')}</ol>
      <p class="fine">가계부를 시작하면 섬에 텃밭이 생기고, 소비 내역을 올리실 때마다 텃밭이 자라요.</p>
    </div>
    <div class="foot over-tab"><button class="gbtn" data-act="budget-start">가계부 시작하기</button></div>
    ${tabbar('ledger')}`;
    const b = p.budget, pl = plan(p, b), rec = spendNow();
    const lives = b.items.filter(it => kindOf(it) === 'live'), fixes = b.items.filter(it => kindOf(it) === 'fix');
    const act = k => rec.filter(x => x.cat === k).reduce((n, x) => n + x.amount, 0);
    const goal = sumOut({ items: lives }), used = lives.reduce((n, it) => n + act(it.k), 0);
    const etc = rec.filter(x => !b.items.some(it => it.k === x.cat)).reduce((n, x) => n + x.amount, 0);
    const overs = lives.filter(it => act(it.k) > (it.v || 0)).sort((x, y) => (act(y.k) - y.v) - (act(x.k) - x.v));
    let head, sub, face;
    if (!rec.length) { head = '이번 달 소비 내역을<br>올려 주세요'; sub = `은행 앱 내역을 캡처해서 올리면 생활비 목표 ${won(goal)}와 비교해 드려요.`; face = 'base'; }
    else {
      head = `생활비 목표 ${won(goal)} 중<br><em data-count="${used}" data-count-id="l-used">${won(used)}</em> 썼어요`;
      if (overs.length) { const o = overs[0]; sub = `${o.t}${josa(o.t, '이', '가')} 목표보다 ${won(act(o.k) - o.v)} 많아요.`; face = 'surprised'; }
      else { sub = `목표 안에서 쓰고 있어요. 남은 생활비는 ${won(goal - used)}이에요.`; face = 'moved'; }
    }
    const day = Number(TODAY.slice(8)), tn = tendCount(), flv = fieldLv(), al = b.alarm || ALARM0;
    const fieldSub = tendedNow(p) ? `${alarmText(al)}에 다시 가꿀 수 있어요` : flv >= ZONE_MAX ? '텃밭이 다 자랐어요. 내역을 올리실 때마다 가꾼 횟수가 쌓여요' : `${alarmSpan(al)} 소비 내역을 올리시면 ${tn ? '텃밭이 한 단계 자라요' : '텃밭이 자라기 시작해요'}`;
    const fieldCard = `<section class="field-card" aria-label="텃밭"><img src="assets/field_lv${flv}.webp" alt="텃밭 ${flv}단계" data-fx="build" data-fx-id="ledger-field" data-fx-key="${flv}" data-fx-enter="${state.grewLedger ? 1 : 0}" data-fx-delay="300"><span><b>${tn ? `텃밭을 ${tn}번 가꿨어요` : '텃밭이 생겼어요'}</b><span>${fieldSub}</span></span></section>`;
    const row = (it, a) => { const over = a > (it.v || 0), pct = it.v ? Math.min(100, a / it.v * 100) : (a ? 100 : 0);
      return `<li class="${over ? 'over' : ''}" data-key="cmp-${esc(it.k)}"><span class="cn"><span aria-hidden="true">${it.e}</span> ${esc(it.t)}</span><span class="cg num">${won(it.v || 0)}</span><span class="ca num">${won(a)}</span><span class="cbar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></span></li>`; };
    return `${bar('가계부')}
    <div class="content">
      ${duo('ledger', face, head, sub, { lg: !rec.length })}
      ${fieldCard}
      <section class="card" aria-labelledby="h-cmp">
        <div class="card-head"><h3 id="h-cmp">목표와 실제</h3><span>${Number(MONTH.slice(5))}월 1일부터 ${day}일까지</span></div>
        <div class="cmp-head" aria-hidden="true"><span>생활비</span><span>목표</span><span>실제</span></div>
        <ul class="cmp">${lives.map(it => row(it, act(it.k))).join('')}
          ${etc ? `<li data-key="cmp-etc"><span class="cn"><span aria-hidden="true">🧾</span> 기타</span><span class="cg">없음</span><span class="ca num">${won(etc)}</span></li>` : ''}
          <li class="sum" data-key="cmp-sum"><span class="cn">합계</span><span class="cg num">${won(goal)}</span><span class="ca num">${won(used + etc)}</span></li></ul>
        ${rec.length ? `<button class="todo-more" data-act="show-tx" aria-expanded="${!!state.showTx}"><span>이번 달 올린 내역 ${rec.length}건</span>${ICON.chev}</button>
        ${state.showTx ? `<ul class="txs">${rec.slice().sort((x, y) => y.date.localeCompare(x.date)).map(x => `<li><span class="td num">${x.date.slice(5).replace('-', '.')}</span><span class="tm">${esc(x.merchant)}</span><span class="tv num">${won(x.amount)}</span><span class="tc">${catLabel(x.cat, b)}</span></li>`).join('')}</ul>` : ''}` : ''}
      </section>
      ${stockCard(p)}
      <section class="card" aria-labelledby="h-fix"><div class="card-head"><h3 id="h-fix">고정 지출 ${fixes.length}개</h3><span class="num">${won(sumOut({ items: fixes }))}</span></div>
        <ul class="rows">${fixes.map(it => `<li data-key="fx-${esc(it.k)}"><button class="list-row" data-bitem="${esc(it.k)}"><span class="k"><span aria-hidden="true">${it.e}</span> ${esc(it.t)}</span><span class="v num">${won(it.v || 0)}${act(it.k) ? `<span class="paid">이번 달 ${won(act(it.k))} 나감</span>` : ''}</span>${ICON.chev}</button></li>`).join('')}</ul>
        <div class="edit-links"><button class="todo-more go-link" data-act="bedit" data-step="budget-fix"><span>고정 지출 고치기</span>${ICON.chev}</button><button class="todo-more go-link" data-act="bedit" data-step="budget-live"><span>생활비 목표 고치기</span>${ICON.chev}</button></div>
      </section>
      <section class="card" aria-labelledby="h-flow">
        <div class="card-head"><h3 id="h-flow">한 달 계산</h3></div>
        <dl class="receipt">
          <div><dt>월급</dt><dd class="num">${won(pl.pay)}</dd></div>
          ${KINDS.map(g => `<div><dt>${g.sub}${g.k === 'live' ? ' 목표' : ''}</dt><dd class="num">−${won(sumOut({ items: b.items.filter(it => kindOf(it) === g.k) }))}</dd></div>`).join('')}
          <div class="sum"><dt>${pl.save < 0 ? '모자란 돈' : '저축할 수 있는 돈'}</dt><dd class="num">${won(Math.abs(pl.save))}</dd></div>
        </dl>
        ${pl.parts.length ? `<h4 class="sub-h">저축은 이렇게 나눠 넣으세요</h4><ul class="parts">${pl.parts.map(x => `<li data-key="${x.k}"><span class="ce" aria-hidden="true">${x.e}</span><span><span class="pt">${x.t}</span><span class="pd">${x.d}</span></span><span class="pv num">${won(x.v)}</span></li>`).join('')}</ul>
        <div class="basis"><span>비상금 3개월치는 흔히 쓰는 기준이에요. 청년 정책 적금 한도는 청년미래적금 기준이에요. 파밍은 투자 상품을 추천하지 않아요.</span></div>` : ''}
        <ul class="rows"><li><button class="list-row" data-act="bedit" data-step="budget-pay"><span class="k">월급</span><span class="v num">${won(pl.pay)}</span>${ICON.chev}</button></li></ul>
      </section>
      <section class="card" aria-labelledby="h-alarm"><div class="card-head"><h3 id="h-alarm">소비 내역 알림</h3></div>
        <ul class="rows"><li><button class="list-row" data-act="bedit" data-step="budget-alarm"><span class="k">🔔 알림</span><span class="v">${alarmText(b.alarm || ALARM0)}</span>${ICON.chev}</button></li></ul>
      </section>
    </div>
    <div class="foot over-tab"><button class="gbtn" data-act="upload">소비 내역 이미지 올리기</button></div>
    ${tabbar('ledger')}`;
  }

  /* 모은 돈(2026-10-25): 꺼낼 수 있는 돈은 한 달에 한 번 소비 내역을 올릴 때 확인하고, 정책 상품은 알려 주신 잔액에 매달 넣는 돈을 더해 채움.
     지난달까지는 확인할 때 남긴 기록, 이번 달은 지금 금액. 6달까지 보여 줌 */
  const monthName = m => `${Number(m.slice(5))}월`;
  function stockCard(p) {
    const cur = { m: MONTH, cash: savedAmt(p), held: heldTotal(p) };
    const list = [...(p.hist || []).filter(h => h.m !== MONTH), cur].sort((x, y) => x.m.localeCompare(y.m)).slice(-6);
    const sel = list.find(h => h.m === state.stockM) || cur, max = Math.max(...list.map(h => h.cash + h.held)) || 1;
    const checked = !!(p.cash && p.cash.at === MONTH);
    const bars = list.map(h => { const tot = h.cash + h.held;
      return `<button data-stock-m="${h.m}" aria-pressed="${h.m === sel.m}" aria-label="${monthName(h.m)} 모은 돈 ${hw(tot)}, 꺼낼 수 있는 돈 ${hw(h.cash)}, 정책 상품 ${hw(h.held)}"><span class="col"><span class="bar" style="height:${Math.max(3, tot / max * 100).toFixed(1)}%">${h.cash ? `<i class="seg cash" style="flex:${h.cash}"></i>` : ''}${h.held ? `<i class="seg held" style="flex:${h.held}"></i>` : ''}</span></span><span class="m">${monthName(h.m)}</span></button>`; }).join('');
    const cashSub = checked ? '' : p.cash ? `${monthName(p.cash.at)}에 확인` : '처음 고르신 구간으로 어림';
    const rows = [`<li><button class="list-row" data-act="cash-open"><span class="k"><i class="sw cash" aria-hidden="true"></i>꺼낼 수 있는 돈</span><span class="v num">${hw(cur.cash)}${cashSub ? `<span class="sub-v">${cashSub}</span>` : ''}</span>${ICON.chev}</button></li>`,
      ...lockedOf(p).map(x => { const h = heldOf(p, x.k), v = heldNow(p, x.k);
        return `<li><button class="list-row" data-held="${x.k}"><span class="k"><i class="sw held" aria-hidden="true"></i>${x.t}</span><span class="v${h ? ' num' : ' empty'}">${h ? hw(v) : '알려 주세요'}${h && h.mon ? `<span class="sub-v">매달 ${hw(h.mon)}씩 더해요</span>` : ''}</span>${ICON.chev}</button></li>`; })];
    return `<section class="card" aria-labelledby="h-stock">
        <div class="card-head"><h3 id="h-stock">모은 돈</h3>${checked ? `<span>${monthName(MONTH)} 확인함</span>` : ''}</div>
        <div class="stock-hero" aria-live="polite"><span class="cap">${monthName(sel.m)}${sel.m === MONTH ? ' 지금' : ''}</span><b>${hw(sel.cash + sel.held)}</b><span class="cap">꺼낼 수 있는 돈 ${hw(sel.cash)}, 정책 상품 ${hw(sel.held)}</span></div>
        <div class="stock-bars${list.length > 1 ? ' many' : ''}" role="group" aria-label="달마다 모은 돈">${bars}</div>
        <div class="legend"><span><i class="sw cash" aria-hidden="true"></i>꺼낼 수 있는 돈</span><span><i class="sw held" aria-hidden="true"></i>정책 상품</span></div>
        <ul class="rows">${rows.join('')}</ul>
        ${list.length < 2 ? '<p class="fine">다음 달에 꺼낼 수 있는 돈을 확인하시면 막대가 하나씩 늘어요.</p>' : ''}
        <div class="basis"><span>정책 상품은 알려 주신 잔액에 매달 넣는 돈을 제가 달마다 더한 금액이에요. 정부 기여금과 이자는 넣지 않았어요.</span><span>꺼낼 수 있는 돈은 한 달에 한 번, 소비 내역을 올리실 때 확인해요.</span></div>
      </section>`;
  }

  /* 소비 내역 읽기: 게시된 시안에서는 보는 사람의 Claude가 사진을 읽음. 읽을 수 없는 곳(파일로 연 시안, 허용 안 함)에서는 예시 내역 */
  let scanFiles = [], scanUrls = [];
  function viewScan() {
    const s = state.scan || { step: 0 };
    const lines = ['날짜와 금액 찾기', '가게 이름으로 항목 나누기', '생활비 목표와 비교하기'];
    return `<header class="bar"><div class="bar-in"><h1>소비 내역 읽기</h1></div></header>
    <div class="content hello">

  const VIEWS = { ledger: viewLedger, 'budget-pay': viewBudgetPay, 'budget-fix': viewBudgetFix, 'budget-live': viewBudgetLive, 'budget-alarm': viewBudgetAlarm, scan: viewScan, 'scan-check': viewScanCheck, start: viewStart, hello: viewHello, q1: viewQ1, q2: viewQ2, q3: viewQ3, q4: viewQ4, q5: viewQ5, calc: viewCalc, result: viewResult, home: viewHome, product: viewStory, isa: viewStory, news: viewNews, me: viewMe, party: viewParty };

  /* 그리기: 화면이 바뀌면 통째로 바꾸고 들어오는 움직임을 줌. 같은 화면 안의 변화는 바뀐 부분만 고쳐서 전환 효과가 이어지게 함 */
  function morph(from, to) {
    for (const { name } of [...from.attributes]) if (!to.hasAttribute(name)) from.removeAttribute(name);
    for (const { name, value } of [...to.attributes]) if (from.getAttribute(name) !== value) from.setAttribute(name, value);
    morphKids(from, to);
  }
  function morphKids(from, to) {
    const a = [...from.childNodes], b = [...to.childNodes];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const x = a[i], y = b[i];
      if (!x) { from.appendChild(y); continue; }
      if (!y) { from.removeChild(x); continue; }
      const same = x.nodeType === y.nodeType && x.nodeName === y.nodeName && (x.nodeType !== 1 || x.getAttribute('data-key') === y.getAttribute('data-key'));
      if (!same) { from.replaceChild(y, x); continue; }
      if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
      morph(x, y);
    }
  }

  const anim = (el, frames, opts) => { if (el && !REDUCED() && el.animate) return el.animate(frames, { easing: EASE, ...opts }); return null; };
  const delayOf = el => Number(el.dataset.fxDelay || 0);
  const FX = {
    hop: el => anim(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-12px) rotate(-3deg)', offset: .35 }, { transform: 'translateY(0)', offset: .7 }, { transform: 'translateY(-3px)', offset: .85 }, { transform: 'translateY(0)' }], { duration: 560 }),
    pop: el => anim(el, [{ transform: 'scale(.92)', opacity: .2 }, { transform: 'scale(1.02)', opacity: 1, offset: .7 }, { transform: 'scale(1)' }], { duration: 360 }),
    tick: el => anim(el, [{ transform: 'scale(.6)' }, { transform: 'scale(1.18)', offset: .6 }, { transform: 'scale(1)' }], { duration: 340 }),
    rise: el => anim(el, [{ transform: 'translateY(12px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: delayOf(el), fill: 'backwards' }),
    fade: el => anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, easing: 'linear' }),

    build: el => anim(el, [{ transform: 'scale(.86) translateY(8px)', opacity: .3 }, { transform: 'scale(1.06)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], { duration: 700, delay: delayOf(el), fill: 'backwards' }),
    sheet: el => { anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'linear' }); anim(el.querySelector('.sheet'), [{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 420 }); }
  };
  const fxSeen = new Map();
  function runFx(root, fresh) {
    root.querySelectorAll('[data-fx]').forEach(el => {
      const id = el.dataset.fxId, key = el.dataset.fxKey;
      if (fxSeen.get(id) === key) return;
      fxSeen.set(id, key);
      if (fresh && el.dataset.fxEnter === '0') return;
      if (el.dataset.fxOnly && el.dataset.fxOnly !== key) return;
      FX[el.dataset.fx](el, fresh);
    });
  }
  const counted = new Map();
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const id = el.dataset.countId, to = Number(el.dataset.count);
      const from = counted.has(id) ? counted.get(id) : 0;
      counted.set(id, to);
      if (from === to || REDUCED()) return;
      const t0 = performance.now() + 240, dur = 800;
      const step = t => {
        if (!el.isConnected || counted.get(id) !== to) return;
        const k = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3);

    const m = new Map();

  }
  function playFlip(root, before) {
    root.querySelectorAll('[data-flip]').forEach(el => {
      if (!before.has(el.dataset.key)) return;
      const dy = before.get(el.dataset.key) - el.getBoundingClientRect().top;

  }
  let lastTab = null;

  }
  /* 파밍이 이어 움직이기: 앞 화면의 파밍이 자리에서 새 화면의 자리로 미끄러짐. 앞 화면에 없으면 통 튀어나옴 */
  function palRect() {
    const el = document.querySelector('#app .hero-pal');

    } else {

    }
  }

  /* 밭: 새로 자란 칸만 새싹이 톡 솟음 */
  let plotSeen = [0, 0, 0, 0, 0];
  function growPlots(root) {
    root.querySelectorAll('.plot').forEach(el => {

  /* 태어난 해 바퀴: 굴리는 동안 가운데 줄을 강조하고, 멈추면 그 해로 정함 */
  const wheels = new WeakSet();
  let wheelTimer = null;

  /* 계산 화면: 줄마다 0.65초 간격으로 체크, 다 되면 파밍이가 놀라고 결과로 넘어감 */
  let calcRun = 0;
  function runCalc() {
    const run = ++calcRun, gap = REDUCED() ? 120 : 650;

    [1, 2, 3].forEach(i => later(gap * i, () => { state.calcStep = i; render(); }));

  let shown = null;
  function render(dir) {

    slideTab(app);
    growPlots(app);

  let toastTimer = null;

  /* 색종이: 한 점에서 위로 퍼졌다가 중력처럼 떨어짐(QwipBook 축하 화면과 같은 움직임) */
  function confetti(origin) {
    if (REDUCED()) return;
    const layer = document.getElementById('fx-layer');
    let cx, cy;
    if (origin) { const r = origin.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
    else { const box = document.querySelector('.app').getBoundingClientRect(); cx = box.left + box.width / 2; cy = Math.min(window.innerHeight * 0.38, 320); }
    const colors = ['var(--good)', 'var(--warn)', 'var(--blue)', 'var(--yellow)', 'var(--pink)', 'var(--purple)', 'var(--fg)', 'var(--bg)'];
    const count = 44, fall = 460;
    for (let i = 0; i < count; i++) {
      const seed = Math.sin(i * 12.9898) * 43758.5453, rand = seed - Math.floor(seed);
      const angle = (-160 + (i / count) * 140 + rand * 18) * Math.PI / 180, dist = 120 + rand * 120;
      const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist * 1.15, spin = rand * 720 - 360, round = i % 3 === 0;
      const w = round ? 9 : 7 + rand * 4, h = round ? 9 : 12 + rand * 6;
      const s = document.createElement('i');
      s.className = 'confetti';
      Object.assign(s.style, { left: `${cx - w / 2}px`, top: `${cy - h / 2}px`, width: `${w}px`, height: `${h}px`, borderRadius: round ? '50%' : '2px', background: colors[i % colors.length], border: i % colors.length === colors.length - 1 ? '1px solid var(--line)' : '0' });
      layer.appendChild(s);

        frames.push({ transform: `translate(${(dx * (burst + f * 0.3)).toFixed(1)}px, ${(dy * burst + fall * f * f).toFixed(1)}px) rotate(${(spin * t).toFixed(0)}deg)`, opacity: t < 0.8 ? 1 : (1 - t) / 0.2 });
      }
      s.animate(frames, { duration: 2100, delay: 120, easing: 'linear', fill: 'backwards' }).onfinish = () => s.remove();
    }
  }
  /* 축하 화면 순서: 빛줄기, 파밍이 튀어나옴, 색종이, 잠시 뒤 놀란 얼굴이 기쁜 얼굴로 */
  let partyTimer = null;
  function partyMoment() {
    const pal = document.getElementById('party-pal');

    clearTimeout(partyTimer);
    partyTimer = setTimeout(() => {
      const el = document.getElementById('party-pal');

    if (t.matches('.sheet-wrap')) { if (!e.target.closest('[data-stop]')) { if (state.sheet === 'cash') cashLater(); else closeSheet(); } return; }
    const d = t.dataset;
    if (d.go) { go(d.go, { dir: t.closest('.tabbar, .review') ? 't' : 'f' }); return; }
    if (d.sheet) { hideToast(); state.sheet = d.sheet; render(); return; }
    if (d.held) { openHeld(d.held); return; }
    if (d.stockM) { state.stockM = d.stockM; render(); return; }
    if (d.done) { finishTask(d.done); return; }
    if (d.sub) { state.sub[d.sub] = 'a'; render(); return; }
    if (d.income) { set('income', d.income); render(); return; }
    if (d.saved) { pickFirst('q3', 'saved', d.saved); return; }
    if (d.where) { set('where', d.where); render(); return; }
    if (d.when) { set('when', d.when); render(); return; }
    if (d.product) {
      let list = state.p.products.slice();
      if (d.product === 'none' || d.product === 'unk') list = list.includes(d.product) ? [] : [d.product];
      else { list = list.filter(k => k !== 'none' && k !== 'unk'); list = list.includes(d.product) ? list.filter(k => k !== d.product) : [...list, d.product]; }
      set('products', list); render(); return;
    }
    if (d.salary) {
      set('salaryA', d.salary === '1'); render();
      toast(d.salary === '1' ? 'A은행 연 3.2%로 다시 계산했어요' : '기본 금리 연 2.9%로 계산할게요');
      return;
    }
    if (d.sme) {
      if (d.sme === 'u') { state.p.sme = null; state.log.unshift({ d: TODAY, t: '중소기업 재직 여부 모름, 일반형과 우대형 모두 계산' }); save(); }
      else set('sme', d.sme === '1');
      markDone('info-sme'); render(); return;
    }
    if (d.smeSheet) {
      const v = d.smeSheet;
      if (v === 'u') { state.log.unshift({ d: TODAY, t: '중소기업 재직 여부 모름, 일반형과 우대형 모두 계산' }); save(); }
      else set('sme', v === '1');
      closeSheet(() => markDone('info-sme'));
      toast(v === '1' ? '우대형으로 계산했어요. 매달 최대 6만 원이에요' : v === '0' ? '일반형으로 계산했어요. 매달 최대 3만 원이에요' : '두 경우를 모두 계산해 둘게요');
      return;
    }
    if (d.dyear) { if (state.heldDraft) state.heldDraft.year = d.dyear; render(); return; }
    if (d.field) { openEdit(d.field); return; }
    if (d.pick) { applyEdit(state.editField, fromKey(state.editField, d.pick)); return; }
    if (d.pickMulti) {
      let list = (state.pick || []).slice(), k = d.pickMulti;
      if (k === 'none' || k === 'unk') list = list.includes(k) ? [] : [k];
      else { list = list.filter(x => x !== 'none' && x !== 'unk'); list = list.includes(k) ? list.filter(x => x !== k) : [...list, k]; }
      state.pick = list; render(); return;
    }
    if (d.add) {
      const b = bdraft(), v = Number(d.add);
      b.pay = v ? (b.pay || 0) + v : null; render();
      const el = document.querySelector('#app [data-money="pay"]'); if (el) el.value = b.pay ? b.pay.toLocaleString('ko-KR') : '';
      return;
    }
    if (d.tog) {
      const b = bdraft(), k = d.tog, has = b.items.some(x => x.k === k);
      if (has) b.items = b.items.filter(x => x.k !== k);
      else { const c = catOf(k, b); b.items.push({ k, e: c.e, t: c.t, v: defAmt(k), kind: kindOf(c), auto: true }); }
      render();
      const hint = document.querySelector('#app [data-left]'); if (hint) hint.innerHTML = leftText((b.pay || 0) - sumOut(b));
      return;
    }
    if (d.freq || d.dow || d.dom || d.time) {
      const a = bdraft().alarm;
      if (d.freq) a.freq = d.freq; if (d.dow) a.dow = Number(d.dow); if (d.dom) a.dom = d.dom === 'end' ? 'end' : Number(d.dom); if (d.time) a.time = d.time;
      render(); return;
    }
    if (d.bitem) { hideToast(); state.bd = JSON.parse(JSON.stringify(state.p.budget)); state.editItem = d.bitem; state.sheet = 'bamt'; render(); return; }
    if (d.txcat) { hideToast(); state.editTx = Number(d.txcat); state.sheet = 'txcat'; render(); return; }
    if (d.txpick) { const x = state.found && state.found.list[state.editTx]; if (x) x.cat = d.txpick; closeSheet(); return; }
    if (d.undo) { state.done = state.done.filter(x => x !== d.undo); save(); render(); return; }
    if (d.zone) { zoneTap(d.zone); return; }
    if (d.quiz) { if (state.quiz[state.si] === undefined) { state.quiz[state.si] = Number(d.quiz); render(); } return; }
    switch (d.act) {
      case 'back': back(); break;
      case 'next': nextFrom(state.screen); break;
      case 'sub-next': state.sub[state.screen] = 'b'; render(); break;
      case 'pal': poke(t); break;
      case 'story-next': storyMove(1); break;
      case 'save-profile': save(); state.stack = []; go('home', { replace: true }); toast('저장했어요. 바뀌면 알려드릴게요'); break;
      case 'held-done': heldSave(); break;
      case 'cash-open': openCash('ledger'); break;
      case 'cash-save': cashSave(); break;
      case 'cash-later': cashLater(); break;
      case 'bank': toast(`실제 버전에서는 ${d.bank} 공식 앱으로 연결돼요`); break;
      case 'notify-on':
        if (state.done.includes('notify')) break;
        state.notify = true; markDone('notify'); render(); toast('알림을 켰어요. 모집이 열리면 알려드릴게요'); break;
      case 'apply': markDone('apply'); render(); toast('실제 버전에서는 신청 페이지로 연결돼요'); break;
      case 'more-tasks': state.moreTasks = !state.moreTasks; render(); break;
      case 'show-done': state.showDone = !state.showDone; render(); break;
      case 'to-result': state.stack = ['me']; go('result', { replace: true }); break;
      case 'edit-monthly': budgetStart('party'); break;
      case 'edit-done': applyEdit(state.editField, state.editField === 'birth' ? (state.pick || state.p.birth) : state.pick); break;
      case 'budget-start': budgetStart('me'); break;
      case 'bnext':
        if (state.screen === 'budget-pay') bdraft().items.forEach(it => { if (it.auto) it.v = defAmt(it.k); });
        if (state.bdEdit || state.screen === 'budget-alarm') budgetSave(); else go(BSTEPS[BSTEPS.indexOf(state.screen) + 1]); break;
      case 'bedit': budgetEdit(d.step); break;
      case 'add-cat': addCat(d.kind); break;
      case 'upload': document.getElementById('spend-file').click(); break;
      case 'scan-cancel': state.scan = null; state.stack = []; go('ledger', { replace: true, dir: 'b' }); break;
      case 'scan-save': scanSave(); break;
      case 'show-tx': state.showTx = !state.showTx; render(); break;
      case 'bamt-save': {
        const el = document.querySelector('.sheet [data-money="sheet"]'), v = el ? parseWon(el.value) : 0;
        budgetCommit(b => { const it = b.items.find(x => x.k === state.editItem); if (it) it.v = v; }); break;
      }
      case 'bamt-remove': budgetCommit(b => { b.items = b.items.filter(x => x.k !== state.editItem); }); break;
      case 'show-log': state.showLog = !state.showLog; render(); break;
      case 'party-close': state.stack = []; state.screen = 'me'; render('b'); break;
      case 'close-sheet': closeSheet(); break;
      case 'wipe-ask': state.confirmWipe = true; render(); break;
      case 'wipe-cancel': state.confirmWipe = false; render(); break;
      case 'wipe': try { localStorage.removeItem(KEY); } catch (err) {} state = fresh(); render('b'); break;
    }
  });
  document.getElementById('spend-file').addEventListener('change', e => {
    const files = [...(e.target.files || [])].slice(0, 5);
    e.target.value = '';
    if (!files.length) return;
    scanUrls.forEach(u => URL.revokeObjectURL(u));
    scanFiles = files; scanUrls = files.map(f => URL.createObjectURL(f));
    if (state.screen === 'scan') { state.scan = null; shown = null; render('f'); }
    else go('scan');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.sheet) { if (state.sheet === 'cash') cashLater(); else closeSheet(); }
    if (STORY_OF[state.screen] && !state.sheet && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.matches('input')) storyMove(e.key === 'ArrowRight' ? 1 : -1);
    if (e.key === 'Enter' && e.target.matches('[data-newcat]')) { e.preventDefault(); const btn = document.querySelector('#app [data-act="add-cat"]'); addCat(btn ? btn.dataset.kind : 'fix'); }
  });
  /* 금액 칸: 적는 대로 쉼표를 넣고, 화면 전체를 다시 그리지 않고 남는 돈과 버튼만 고침 */
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.matches('[data-money]')) return;
    const v = parseWon(el.value), k = el.dataset.money;
    el.value = v ? v.toLocaleString('ko-KR') : '';
    if (k === 'cash') { if (state.cashDraft) state.cashDraft.v = v || null; const btn = document.querySelector('.sheet [data-act="cash-save"]'); if (btn) btn.disabled = !v; return; }
    if (k === 'held-bal' || k === 'held-mon') { const h = state.heldDraft; if (!h) return; h[k.slice(5)] = v || null; const btn = document.querySelector('.sheet [data-act="held-done"]'); if (btn) btn.disabled = !heldReady(state.heldK, h); return; }
    if (k === 'sheet' || !state.bd) return;
    if (k === 'pay') { state.bd.pay = v || null; const btn = document.querySelector('#app .foot .gbtn'); if (btn) btn.disabled = !v; const han = document.querySelector('#app [data-han]'); if (han) han.textContent = hanWon(v); return; }
    const it = state.bd.items.find(x => x.k === k.slice(5));
    if (it) { it.v = v; delete it.auto; }
    const hint = document.querySelector('#app [data-left]');
    if (hint) hint.innerHTML = leftText((state.bd.pay || 0) - sumOut(state.bd));
  });

  document.getElementById('review-list').innerHTML = SCREENS.map(([k, t]) => `<button data-go="${k}">${t}</button>`).join('');
  load();
  state.sheet = null; state.cheer = null; state.poke = null; state.party = null; state.sub = { hello: 'a', q3: 'a' };
  const hash = (location.hash || '').slice(1);
  if (VIEWS[hash]) { if (NEEDS_PROFILE.includes(hash)) useSampleIfNeeded(); state.screen = hash; if (hash === 'news') state.seenNews = true; }
  render();
})();
</script>

</body></html>
