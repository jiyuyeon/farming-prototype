  const CAT_KEYS = () => [...CATS, ...((state.p.budget && state.p.budget.custom) || [])];
  function scanPrompt() {
    const keys = CAT_KEYS().map(c => `${c.k}: ${c.t}${c.d ? `(${c.d})` : ''}`).join(', ');
    return `이 이미지는 한국 은행이나 카드 앱의 소비 내역(거래 내역) 화면 캡처예요.
돈이 나간 거래만 골라 주세요. 입금, 월급, 내 계좌끼리 옮긴 돈, 취소된 결제는 빼 주세요.
각 거래를 {"date":"YYYY-MM-DD","merchant":"가게나 받는 곳 이름","amount":원 단위 양의 정수,"cat":"항목 키"} 로 적어요.
항목 키는 다음 중 하나로 고르고, 맞는 게 없으면 "etc": ${keys}.
식당, 배달, 장보기는 food, 카페, 편의점 간식, 디저트는 cafe, 대중교통, 택시, 주유는 move, 선물과 경조사비는 meet, 온라인 쇼핑과 옷과 생활용품은 shop이에요.
연도가 안 보이면 ${YEAR}년, 날짜가 안 보이면 ${TODAY}로 적어요.
계좌번호, 카드번호, 잔액, 사람 이름의 성 이외 개인정보는 답에 넣지 마세요.
다른 말 없이 JSON 배열만 답해 주세요.`;
  }
  function cleanSpend(raw) {
    const keys = CAT_KEYS().map(c => c.k);
    return (Array.isArray(raw) ? raw : []).map(x => ({
      date: /^\d{4}-\d{2}-\d{2}$/.test(String(x && x.date)) ? String(x.date) : TODAY,
      merchant: String((x && x.merchant) || '알 수 없음').slice(0, 30),
      amount: Math.round(Math.abs(Number(x && x.amount) || 0)),
      cat: keys.includes(String(x && x.cat)) ? String(x.cat) : 'etc'
    })).filter(x => x.amount > 0).slice(0, 80);
  }
  /* 예시 내역: 이번 달 안의 날짜로 */
  function exampleSpend() {
    const d = n => { const day = Math.max(1, Number(TODAY.slice(8)) - n); return `${MONTH}-${pad(day)}`; };
    return [['배달의민족', 23500, 'food', 0], ['스타벅스', 6300, 'cafe', 0], ['교통카드 자동충전', 30000, 'move', 1], ['쿠팡', 27900, 'shop', 1], ['김밥천국', 8000, 'food', 2], ['메가커피', 2000, 'cafe', 2],
      ['이마트', 42300, 'food', 3], ['카카오T 택시', 12400, 'move', 4], ['카카오톡 선물하기', 25000, 'meet', 5], ['넷플릭스', 13500, 'subs', 6], ['SKT 통신요금', 55000, 'phone', 7], ['GS25', 4800, 'cafe', 8], ['무신사', 59000, 'shop', 9]]
      .map(([merchant, amount, cat, n]) => ({ date: d(n), merchant, amount, cat }));
  }
  let scanRun = 0;
  async function runScan() {
    const run = ++scanRun;
    state.scan = { step: 0, err: null };
    const alive = () => run === scanRun && state.screen === 'scan';
    const tick = i => { if (alive()) { state.scan.step = i; render(); } };
    setTimeout(() => tick(1), REDUCED() ? 100 : 600);
    let list = null, demo = false;
    const sample = await samplerP;
    const caps = sample ? await sample.limits().catch(() => null) : null;
    if (sample && caps && caps.images) {
      try { list = cleanSpend(await sample.json(scanPrompt(), { images: scanFiles.slice(0, caps.images.maxCount), modelTier: 'default' })); }
      catch (e) {
        const code = e && e.code;
        if (['not_granted', 'sampling_disabled', 'images_unavailable', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) demo = true;
        else if (code !== 'cancelled') {
          if (!alive()) return;
          state.scan.err = code === 'rate_limited' ? '지금은 요청이 많아요. 잠시 뒤 다시 올려 주세요.' : code === 'image_rejected' ? '이 사진은 읽을 수 없어요. 다른 사진으로 올려 주세요.' : code === 'invalid_json' || code === 'empty_completion' || code === 'refused' ? '소비 내역을 찾지 못했어요. 은행 앱의 거래 내역 화면을 캡처했는지 봐 주세요.' : '연결이 끊겼어요. 다시 올려 주세요.';
          render(); return;
        }
      }
    } else demo = true;
    if (demo) { await wait(REDUCED() ? 300 : 1600); list = exampleSpend(); }
    if (!alive()) return;
    if (!list || !list.length) { state.scan.err = '소비 내역을 찾지 못했어요. 은행 앱의 거래 내역 화면을 캡처했는지 봐 주세요.'; render(); return; }
    tick(2); await wait(REDUCED() ? 80 : 500); tick(3); await wait(REDUCED() ? 80 : 500);
    if (!alive()) return;
    state.found = { list, demo };
    go('scan-check', { replace: true });
  }
  function scanSave() {
    const have = new Set((state.spend || []).map(x => `${x.date}|${x.merchant}|${x.amount}`));
    let added = 0, dup = 0;
    (state.found ? state.found.list : []).forEach(x => { const key = `${x.date}|${x.merchant}|${x.amount}`; if (have.has(key)) dup++; else { have.add(key); state.spend.push(x); added++; } });
    const b = state.p.budget, key = b && tendKey(b.alarm || ALARM0), tended = !!(added && b && !state.tends.some(t => t.key === key));
    if (tended) { state.tends = [...state.tends, { key, d: TODAY }]; state.grew = `텃밭을 가꿨어요!\n지금까지 ${tendCount()}번 가꿨어요`; state.grewLedger = true; }
    state.found = null; save();
    state.stack = []; go('ledger', { replace: true, dir: 'b' });
    state.grewLedger = false;
    toast(added ? `${added}건을 넣었어요${tended ? '. 텃밭을 가꿨어요' : ''}${dup ? `. 이미 있던 ${dup}건은 뺐어요` : ''}` : `이미 넣은 내역이에요. ${dup}건 모두 그대로예요`);
  }

  const KEY = 'paming-mvp-v3';
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ p: state.p, stamps: state.stamps, log: state.log, done: state.done, sample: state.sample, seenNews: state.seenNews, notify: state.notify, spend: state.spend, tends: state.tends })); } catch (e) {} }
  function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.p) Object.assign(state, s); } catch (e) {} }

  function nextFrom(screen) {
    if (screen === 'q1') {
      const el = document.querySelector('#app .wheel');
      clearTimeout(wheelTimer);
      if (el) set('birth', YEARS[wheelIndex(el)]);
    }
    if (screen === 'q5') {
      state.sample = false;
      FIELDS.forEach(x => { const v = state.p[x.f]; if (v !== null && !(Array.isArray(v) && !v.length)) state.stamps[x.f] = TODAY; });
      state.log = [{ d: TODAY, t: '처음 입력 7개 항목' }];
      save();
    }
    const order = ['q1', 'q2', 'q3', 'q4', 'q5', 'calc'];
    go(order[order.indexOf(screen) + 1]);
  }
  /* 첫 갈래를 고르면 잠깐 선택을 보여준 뒤 파밍이가 다음 질문을 물음 */
  let subTimer = null;
  function pickFirst(q, field, value) {
    set(field, value); render();
    clearTimeout(subTimer);
    subTimer = setTimeout(() => { if (state.screen === q && state.sub[q] === 'a') { state.sub[q] = 'b'; render(); } }, 380);
  }

  document.addEventListener('click', e => {
    const item = e.target.closest('.wheel-item');
    if (item) {
      const el = item.closest('.wheel');
      el.scrollTo({ top: YEARS.indexOf(Number(item.dataset.year)) * 44, behavior: REDUCED() ? 'auto' : 'smooth' });
      return;
    }
    const tap = e.target.closest('[data-tap]');
    if (tap && !e.target.closest('button')) { const r = tap.getBoundingClientRect(); storyMove(e.clientX < r.left + r.width / 3 ? -1 : 1); return; }
    const t = e.target.closest('button, .sheet-wrap');
    if (!t) return;
    if (t.matches('.sheet-wrap')) { if (!e.target.closest('[data-stop]')) closeSheet(); return; }
    const d = t.dataset;
    if (d.go) { go(d.go, { dir: t.closest('.tabbar, .review') ? 't' : 'f' }); return; }
    if (d.sheet) { hideToast(); state.sheet = d.sheet; render(); return; }
    if (d.done) { finishTask(d.done); return; }
    if (d.sub) { state.sub[d.sub] = 'a'; render(); return; }
    if (d.income) { set('income', d.income); render(); return; }
    if (d.saved) { pickFirst('q3', 'saved', d.saved); return; }
    if (d.where) { set('where', d.where); render(); return; }
    if (d.monthly) { pickFirst('q4', 'monthly', d.monthly); return; }
    if (d.when) { set('when', d.when); render(); return; }
    if (d.product) {
      let list = state.p.products.slice();
      if (d.product === 'none' || d.product === 'unk') list = list.includes(d.product) ? [] : [d.product];
      else { list = list.filter(k => k !== 'none' && k !== 'unk'); list = list.includes(d.product) ? list.filter(k => k !== d.product) : [...list, d.product]; }
      set('products', list); render(); return;
    }
    if (d.salary) {
      set('salaryA', d.salary === '1'); render();
      toast(d.salary === '1' ? 'A은행 연 3.2%로 다시 계산했어요' : '기본 금리 연 2.9%로 계산할게요');
      return;
    }
    if (d.sme) {
      if (d.sme === 'u') { state.p.sme = null; state.log.unshift({ d: TODAY, t: '중소기업 재직 여부 모름, 일반형과 우대형 모두 계산' }); save(); }
      else set('sme', d.sme === '1');
      markDone('info-sme'); render(); return;
    }
    if (d.smeSheet) {
      const v = d.smeSheet;
      if (v === 'u') { state.log.unshift({ d: TODAY, t: '중소기업 재직 여부 모름, 일반형과 우대형 모두 계산' }); save(); }
      else set('sme', v === '1');
      closeSheet(() => markDone('info-sme'));
      toast(v === '1' ? '우대형으로 계산했어요. 매달 최대 6만 원이에요' : v === '0' ? '일반형으로 계산했어요. 매달 최대 3만 원이에요' : '두 경우를 모두 계산해 둘게요');
      return;
    }
    if (d.dyear) { set('doyakYear', d.dyear); render(); return; }
    if (d.dpaid) { set('doyakPaid', d.dpaid); render(); return; }
    if (d.field) { openEdit(d.field); return; }
    if (d.pick) { applyEdit(state.editField, fromKey(state.editField, d.pick)); return; }
    if (d.pickMulti) {
      let list = (state.pick || []).slice(), k = d.pickMulti;
      if (k === 'none' || k === 'unk') list = list.includes(k) ? [] : [k];
      else { list = list.filter(x => x !== 'none' && x !== 'unk'); list = list.includes(k) ? list.filter(x => x !== k) : [...list, k]; }
      state.pick = list; render(); return;
    }
    if (d.add) {
      const b = bdraft(), v = Number(d.add);
      b.pay = v ? (b.pay || 0) + v : null; render();
      const el = document.querySelector('#app [data-money="pay"]'); if (el) el.value = b.pay ? b.pay.toLocaleString('ko-KR') : '';
      return;
    }
    if (d.tog) {
      const b = bdraft(), k = d.tog, has = b.items.some(x => x.k === k);
      if (has) b.items = b.items.filter(x => x.k !== k);
      else { const c = catOf(k, b); b.items.push({ k, e: c.e, t: c.t, v: defAmt(k), kind: kindOf(c), auto: true }); }
      render();
      const hint = document.querySelector('#app [data-left]'); if (hint) hint.innerHTML = leftText((b.pay || 0) - sumOut(b));
      return;
    }
    if (d.freq || d.dow || d.dom || d.time) {
      const a = bdraft().alarm;
      if (d.freq) a.freq = d.freq; if (d.dow) a.dow = Number(d.dow); if (d.dom) a.dom = d.dom === 'end' ? 'end' : Number(d.dom); if (d.time) a.time = d.time;
      render(); return;
    }
    if (d.bitem) { hideToast(); state.bd = JSON.parse(JSON.stringify(state.p.budget)); state.editItem = d.bitem; state.sheet = 'bamt'; render(); return; }
    if (d.txcat) { hideToast(); state.editTx = Number(d.txcat); state.sheet = 'txcat'; render(); return; }
    if (d.txpick) { const x = state.found && state.found.list[state.editTx]; if (x) x.cat = d.txpick; closeSheet(); return; }
    if (d.undo) { state.done = state.done.filter(x => x !== d.undo); save(); render(); return; }
    if (d.zone) { zoneTap(d.zone); return; }
    if (d.quiz) { if (state.quiz[state.si] === undefined) { state.quiz[state.si] = Number(d.quiz); render(); } return; }
    switch (d.act) {
      case 'back': back(); break;
      case 'next': nextFrom(state.screen); break;
      case 'sub-next': state.sub[state.screen] = 'b'; render(); break;
      case 'pal': poke(t); break;
      case 'story-next': storyMove(1); break;
      case 'save-profile': save(); state.stack = []; go('home', { replace: true }); toast('저장했어요. 바뀌면 알려드릴게요'); break;
      case 'doyak-done': closeSheet(() => markDone('info-doyak')); break;
      case 'bank': toast(`실제 버전에서는 ${d.bank} 공식 앱으로 연결돼요`); break;
      case 'notify-on':
        if (state.done.includes('notify')) break;
        state.notify = true; markDone('notify'); render(); toast('알림을 켰어요. 모집이 열리면 알려드릴게요'); break;
      case 'apply': markDone('apply'); render(); toast('실제 버전에서는 신청 페이지로 연결돼요'); break;
      case 'more-tasks': state.moreTasks = !state.moreTasks; render(); break;
      case 'show-done': state.showDone = !state.showDone; render(); break;
      case 'to-result': state.stack = ['me']; go('result', { replace: true }); break;
      case 'edit-monthly': budgetStart('party'); break;
      case 'edit-done': applyEdit(state.editField, state.editField === 'birth' ? (state.pick || state.p.birth) : state.pick); break;
      case 'budget-start': budgetStart('me'); break;
      case 'bnext':
        if (state.screen === 'budget-pay') bdraft().items.forEach(it => { if (it.auto) it.v = defAmt(it.k); });
        if (state.bdEdit || state.screen === 'budget-alarm') budgetSave(); else go(BSTEPS[BSTEPS.indexOf(state.screen) + 1]); break;
      case 'bedit': budgetEdit(d.step); break;
      case 'add-cat': addCat(d.kind); break;
      case 'upload': document.getElementById('spend-file').click(); break;
      case 'scan-cancel': state.scan = null; state.stack = []; go('ledger', { replace: true, dir: 'b' }); break;
      case 'scan-save': scanSave(); break;
      case 'show-tx': state.showTx = !state.showTx; render(); break;
      case 'bamt-save': {
        const el = document.querySelector('.sheet [data-money="sheet"]'), v = el ? parseWon(el.value) : 0;
        budgetCommit(b => { const it = b.items.find(x => x.k === state.editItem); if (it) it.v = v; }); break;
      }
      case 'bamt-remove': budgetCommit(b => { b.items = b.items.filter(x => x.k !== state.editItem); }); break;
      case 'show-log': state.showLog = !state.showLog; render(); break;
      case 'party-close': state.stack = []; state.screen = 'me'; render('b'); break;
      case 'close-sheet': closeSheet(); break;
      case 'wipe-ask': state.confirmWipe = true; render(); break;
      case 'wipe-cancel': state.confirmWipe = false; render(); break;
      case 'wipe': try { localStorage.removeItem(KEY); } catch (err) {} state = fresh(); render('b'); break;
    }
  });
  document.getElementById('spend-file').addEventListener('change', e => {
    const files = [...(e.target.files || [])].slice(0, 5);
    e.target.value = '';
    if (!files.length) return;
    scanUrls.forEach(u => URL.revokeObjectURL(u));
    scanFiles = files; scanUrls = files.map(f => URL.createObjectURL(f));
    if (state.screen === 'scan') { state.scan = null; shown = null; render('f'); }
    else go('scan');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.sheet) closeSheet();
    if (STORY_OF[state.screen] && !state.sheet && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.matches('input')) storyMove(e.key === 'ArrowRight' ? 1 : -1);
    if (e.key === 'Enter' && e.target.matches('[data-newcat]')) { e.preventDefault(); const btn = document.querySelector('#app [data-act="add-cat"]'); addCat(btn ? btn.dataset.kind : 'fix'); }
  });
  /* 금액 칸: 적는 대로 쉼표를 넣고, 화면 전체를 다시 그리지 않고 남는 돈과 버튼만 고침 */
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.matches('[data-money]')) return;
    const v = parseWon(el.value), k = el.dataset.money;
    el.value = v ? v.toLocaleString('ko-KR') : '';
    if (k === 'sheet' || !state.bd) return;
    if (k === 'pay') { state.bd.pay = v || null; const btn = document.querySelector('#app .foot .gbtn'); if (btn) btn.disabled = !v; const han = document.querySelector('#app [data-han]'); if (han) han.textContent = hanWon(v); return; }
    const it = state.bd.items.find(x => x.k === k.slice(5));
    if (it) { it.v = v; delete it.auto; }
    const hint = document.querySelector('#app [data-left]');
    if (hint) hint.innerHTML = leftText((state.bd.pay || 0) - sumOut(state.bd));
  });

  document.getElementById('review-list').innerHTML = SCREENS.map(([k, t]) => `<button data-go="${k}">${t}</button>`).join('');
  load();
  state.sheet = null; state.cheer = null; state.poke = null; state.party = null; state.sub = { q3: 'a', q4: 'a' };
  const hash = (location.hash || '').slice(1);
  if (VIEWS[hash]) { if (NEEDS_PROFILE.includes(hash)) useSampleIfNeeded(); state.screen = hash; if (hash === 'news') state.seenNews = true; }
  render();
})();
</script>

</body></html>
